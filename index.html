<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Bash Training | Phase 2</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bash Training">
<meta name="theme-color" content="#FFD600">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════════
   BASH TRAINING | PHASE 2
   Athletic design — Barlow Condensed + Yellow + Cards
══════════════════════════════════════════════════════ */
:root {
  --y: #FFD600;          /* primary yellow */
  --y2: #F5B800;         /* yellow hover */
  --blk: #0D0D0D;        /* near black */
  --bg: #F5F5F3;         /* off-white background */
  --card: #FFFFFF;       /* card white */
  --card2: #F9F9F7;      /* subtle card */
  --text: #0D0D0D;       /* primary text */
  --text2: #666666;      /* secondary */
  --text3: #AAAAAA;      /* tertiary */
  --border: #E8E8E4;     /* subtle border */
  --border2: #D0D0C8;    /* stronger border */
  --push: #FF4D00;       /* orange-red */
  --pull: #0066FF;       /* blue */
  --legs: #8B00FF;       /* purple */
  --upb: #00AA44;        /* green */
  --mob: #FF8800;        /* amber */
  --abs: #FF0055;        /* red */
  --green: #00AA44;
  --red: #FF2D2D;
  --amber: #FF8800;
  --ss: #5500CC;
  --r: 16px;
  --rs: 10px;
  --shadow: 0 2px 12px rgba(0,0,0,.06);
  --shadow2: 0 4px 24px rgba(0,0,0,.10);
}
[data-dark] {
  --bg: #0D0D0D;
  --card: #1A1A1A;
  --card2: #222222;
  --text: #F5F5F3;
  --text2: #888888;
  --text3: #555555;
  --border: #2A2A2A;
  --border2: #333333;
  --shadow: 0 2px 12px rgba(0,0,0,.3);
  --shadow2: 0 4px 24px rgba(0,0,0,.5);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { scroll-behavior: smooth; }
body {
  font-family: 'Barlow', -apple-system, sans-serif;
  font-size: 15px;
  line-height: 1.5;
  background: var(--bg);
  color: var(--text);
  padding-bottom: 80px;
  min-height: 100vh;
  transition: background .2s, color .2s;
}
.hidden { display: none !important; }

/* ── SCROLLBAR ── */
::-webkit-scrollbar { width: 3px; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

/* ── NAV ── */
.nav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 200;
  display: flex; background: var(--card);
  border-top: 1px solid var(--border);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  box-shadow: 0 -4px 20px rgba(0,0,0,.08);
}
.nb {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  padding: 8px 2px 6px; border: none; background: none;
  cursor: pointer; gap: 3px; transition: all .15s;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 10px; font-weight: 700; color: var(--text3);
  text-transform: uppercase; letter-spacing: .5px; min-width: 40px;
}
.nb.on { color: var(--blk); }
[data-dark] .nb.on { color: var(--y); }
.nb-icon {
  width: 28px; height: 28px; border-radius: 8px; display: flex;
  align-items: center; justify-content: center; transition: all .15s;
}
.nb.on .nb-icon { background: var(--y); }
.nb svg { width: 16px; height: 16px; stroke-width: 2; }

/* ── PAGE ── */
.pg { max-width: 640px; margin: 0 auto; }

/* ── HERO HEADER ── */
.pg-hero {
  background: var(--blk);
  padding: 20px 20px 16px;
  position: sticky; top: 0; z-index: 100;
}
.hero-eyebrow {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 11px; font-weight: 700; color: var(--y);
  text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 2px;
}
.hero-title {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 28px; font-weight: 900; color: #fff;
  line-height: 1.1; letter-spacing: -.5px;
}
.hero-title span { color: var(--y); }
.hero-sub { font-size: 12px; color: #888; margin-top: 3px; }

/* ── SECTION ── */
.pg-body { padding: 16px; }
.section-title {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 13px; font-weight: 800; color: var(--text2);
  text-transform: uppercase; letter-spacing: 1px;
  margin-bottom: 10px; margin-top: 4px;
}

/* ── CARD ── */
.card {
  background: var(--card);
  border-radius: var(--r);
  border: 1px solid var(--border);
  padding: 16px;
  margin-bottom: 12px;
  box-shadow: var(--shadow);
}
.card-accent { border-left: 4px solid var(--y); }
.card-push { border-left: 4px solid var(--push); }
.card-pull { border-left: 4px solid var(--pull); }
.card-legs { border-left: 4px solid var(--legs); }
.card-upb { border-left: 4px solid var(--upb); }
.card-mob { border-left: 4px solid var(--mob); }

/* ── BADGE ── */
.badge {
  display: inline-flex; align-items: center;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 11px; font-weight: 700;
  padding: 3px 10px; border-radius: 20px;
  text-transform: uppercase; letter-spacing: .5px;
}
.Push { background: rgba(255,77,0,.1); color: var(--push); }
.Pull { background: rgba(0,102,255,.1); color: var(--pull); }
.Legs { background: rgba(139,0,255,.1); color: var(--legs); }
.UpperB { background: rgba(0,170,68,.1); color: var(--upb); }
.Mobility { background: rgba(255,136,0,.1); color: var(--mob); }
.Other { background: var(--card2); color: var(--text2); }
.Phase1 { background: rgba(0,0,0,.06); color: var(--text2); }
.Phase2 { background: rgba(255,214,0,.15); color: #806000; }
[data-dark] .Phase2 { background: rgba(255,214,0,.15); color: var(--y); }

/* ── BUTTONS ── */
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  gap: 6px; padding: 12px 18px; border-radius: var(--rs);
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 14px; font-weight: 700; letter-spacing: .5px;
  text-transform: uppercase; border: none; cursor: pointer;
  transition: all .15s;
}
.btn:active { transform: scale(.97); }
.btn-y { background: var(--y); color: var(--blk); }
.btn-y:hover { background: var(--y2); }
.btn-blk { background: var(--blk); color: #fff; }
.btn-ghost { background: transparent; color: var(--text); border: 1.5px solid var(--border2); }
.btn-red { background: rgba(255,45,45,.1); color: var(--red); border: 1px solid rgba(255,45,45,.2); }
.btn-green { background: rgba(0,170,68,.1); color: var(--green); border: 1px solid rgba(0,170,68,.2); }
.btn-amber { background: rgba(255,136,0,.1); color: var(--amber); border: 1px solid rgba(255,136,0,.2); }
.btn-ss { background: rgba(85,0,204,.1); color: var(--ss); border: 1px solid rgba(85,0,204,.2); }
.btn-full { width: 100%; }
.btn-sm { padding: 7px 12px; font-size: 12px; }
.btn-xs { padding: 4px 8px; font-size: 11px; }

/* ── FORMS ── */
input, select, textarea {
  width: 100%; padding: 11px 13px;
  border-radius: var(--rs); border: 1.5px solid var(--border);
  background: var(--card2); color: var(--text);
  font-size: 14px; font-family: 'Barlow', sans-serif;
  -webkit-appearance: none; transition: border-color .15s;
}
input:focus, select:focus, textarea:focus {
  outline: none; border-color: var(--y);
  box-shadow: 0 0 0 3px rgba(255,214,0,.15);
}
label {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 11px; font-weight: 700; color: var(--text2);
  display: block; margin-bottom: 5px;
  text-transform: uppercase; letter-spacing: .5px;
}
.field { margin-bottom: 14px; }
.g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.g3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.g4 { display: grid; grid-template-columns: repeat(4,1fr); gap: 6px; }

/* ── TABS ── */
.tabs-wrap { overflow-x: auto; -ms-overflow-style: none; scrollbar-width: none; margin-bottom: 16px; }
.tabs-wrap::-webkit-scrollbar { display: none; }
.tabs { display: inline-flex; gap: 6px; background: var(--card2); padding: 5px; border-radius: 12px; }
.tab {
  padding: 8px 16px; border-radius: 8px;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 13px; font-weight: 700; cursor: pointer;
  color: var(--text2); white-space: nowrap;
  transition: all .15s; text-transform: uppercase; letter-spacing: .5px;
}
.tab.on { background: var(--blk); color: var(--y); }

/* ── TIMER ── */
.timer-wrap {
  background: var(--blk); border-radius: var(--r);
  padding: 10px 14px; margin-bottom: 10px;
  display: flex; align-items: center; gap: 12px;
}
/* ── FLOATING ACTIVE TIMER ── */
.timer-float {
  position: fixed; bottom: 82px; left: 50%;
  transform: translateX(-50%);
  width: calc(100% - 32px); max-width: 608px;
  background: var(--blk); border-radius: 14px;
  padding: 10px 14px; display: flex; align-items: center; gap: 12px;
  z-index: 150; box-shadow: 0 8px 32px rgba(0,0,0,.5);
  border: 1.5px solid #333; display: none;
}
.timer-float.visible { display: flex; }
.timer-display {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 42px; font-weight: 900; color: #fff;
  letter-spacing: -1px; min-width: 90px;
  font-variant-numeric: tabular-nums;
}
.timer-display.run { color: var(--y); }
.timer-display.done { color: var(--red); }
.timer-presets { display: flex; gap: 5px; flex-wrap: wrap; }
.t-pre {
  padding: 5px 10px; border-radius: 6px;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 12px; font-weight: 700; cursor: pointer;
  border: 1.5px solid #333; background: #1A1A1A;
  color: #888; transition: all .15s; text-transform: uppercase;
}
.t-pre.on, .t-pre:hover { background: var(--y); color: var(--blk); border-color: var(--y); }
.timer-btns { display: flex; gap: 6px; margin-top: 8px; }
.timer-btn { background: var(--y); color: var(--blk); padding: 8px 16px; border-radius: 8px; font-family: 'Barlow Condensed', sans-serif; font-size: 13px; font-weight: 800; border: none; cursor: pointer; flex: 1; text-transform: uppercase; letter-spacing: .5px; }
.timer-reset { background: #2A2A2A; color: #888; padding: 8px 12px; border-radius: 8px; font-family: 'Barlow Condensed', sans-serif; font-size: 13px; font-weight: 700; border: none; cursor: pointer; text-transform: uppercase; letter-spacing: .5px; }

/* ── EXERCISE CARD ── */
.ex-card {
  background: var(--card2); border-radius: 12px;
  border: 1.5px solid var(--border);
  padding: 14px; margin-bottom: 8px;
  cursor: grab; transition: border-color .15s;
}
.ex-card:active { cursor: grabbing; }
.ex-card.ss-hi { border-left: 4px solid var(--ss); }
.ex-card.dragging { opacity: .4; }
.ex-card.drag-over { border-top: 3px solid var(--y); }
.drag-handle { font-size: 18px; color: var(--text3); cursor: grab; padding: 0 8px 0 0; flex-shrink: 0; line-height: 1; }
.ex-name-row { display: flex; align-items: flex-start; gap: 6px; margin-bottom: 10px; }
.ex-name { font-family: 'Barlow Condensed', sans-serif; font-size: 15px; font-weight: 800; flex: 1; line-height: 1.2; letter-spacing: .2px; word-break: break-word; }
.ex-muscle-tag {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 10px; font-weight: 700; padding: 3px 8px;
  border-radius: 20px; background: var(--y); color: var(--blk);
  text-transform: uppercase; letter-spacing: .5px; flex-shrink: 0;
}
.plan-specs {
  display: grid; grid-template-columns: repeat(5,1fr); gap: 3px;
  background: var(--card); border-radius: 8px; padding: 8px; margin-bottom: 8px;
}
.plan-spec { text-align: center; }
.plan-spec-l { font-family: 'Barlow Condensed', sans-serif; font-size: 9px; color: var(--text3); text-transform: uppercase; letter-spacing: .5px; display: block; }
.plan-spec-v { font-family: 'Barlow Condensed', sans-serif; font-size: 13px; font-weight: 700; color: var(--text); display: block; word-break: break-word; }
.plan-note { font-size: 11px; color: var(--text2); margin-top: 4px; line-height: 1.4; }
.ss-badge { display: inline-flex; align-items: center; gap: 4px; background: rgba(85,0,204,.08); border: 1px solid rgba(85,0,204,.15); color: var(--ss); font-family: 'Barlow Condensed', sans-serif; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 5px; margin-bottom: 8px; }
.tag { font-family: 'Barlow Condensed', sans-serif; font-size: 9px; font-weight: 700; padding: 2px 5px; border-radius: 3px; margin-left: 4px; text-transform: uppercase; letter-spacing: .3px; }
.tag-new { background: rgba(0,170,68,.12); color: var(--green); }
.tag-fix { background: rgba(255,136,0,.12); color: var(--amber); }
.tag-crit { background: rgba(255,45,45,.12); color: var(--red); }
.tag-ss { background: rgba(85,0,204,.1); color: var(--ss); }
.tag-abs { background: rgba(255,0,85,.1); color: var(--abs); }

/* ── LOG EXERCISE ── */
.log-ex {
  background: var(--card); border-radius: 12px;
  border: 1.5px solid var(--border);
  padding: 14px; margin-bottom: 8px;
  box-shadow: var(--shadow);
}
.log-ex.ss-hi { border-left: 4px solid var(--ss); }
.log-ex.saved { border-left: 4px solid var(--green); }
.log-ex-name-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.log-ex-name { font-family: 'Barlow Condensed', sans-serif; font-size: 15px; font-weight: 800; flex: 1; background: none; border: none; color: var(--text); padding: 0; }
.log-ex-name:disabled { opacity: 1; }
.prev-box { background: rgba(255,214,0,.08); border: 1px solid rgba(255,214,0,.2); border-radius: 8px; padding: 7px 10px; margin-bottom: 8px; font-size: 11px; }
.prev-box-label { font-family: 'Barlow Condensed', sans-serif; font-size: 9px; font-weight: 700; color: var(--text3); text-transform: uppercase; letter-spacing: .5px; display: block; margin-bottom: 2px; }
.prev-box-val { color: var(--text); font-weight: 600; }
.plan-hint { background: rgba(255,214,0,.06); border-radius: 6px; padding: 5px 8px; margin-bottom: 8px; font-size: 11px; color: #806000; }
[data-dark] .plan-hint { color: var(--y); }
.set-header { display: grid; grid-template-columns: 22px 1fr 1fr 1fr 1fr 24px 24px; gap: 4px; margin-bottom: 4px; }
.set-header span { font-family: 'Barlow Condensed', sans-serif; font-size: 10px; font-weight: 700; color: var(--text3); text-align: center; text-transform: uppercase; letter-spacing: .5px; }
.set-row { display: grid; grid-template-columns: 22px 1fr 1fr 1fr 1fr 24px 24px; gap: 4px; margin-bottom: 5px; align-items: center; }
.set-num { font-family: 'Barlow Condensed', sans-serif; font-size: 12px; font-weight: 700; color: var(--text3); text-align: center; }
.set-row input { padding: 8px 4px; font-size: 13px; text-align: center; border-radius: 6px; }
.set-btn { background: none; border: none; cursor: pointer; font-size: 16px; text-align: center; padding: 2px; color: var(--text3); }
.saved-tag { font-family: 'Barlow Condensed', sans-serif; font-size: 11px; font-weight: 700; color: var(--green); margin-top: 6px; }
.alt-row { display: flex; gap: 6px; margin-top: 10px; align-items: center; }
.alt-row select { font-size: 12px; padding: 6px 8px; }

/* ── HISTORY CARD ── */
.hist-card {
  background: var(--card); border-radius: var(--r);
  border: 1px solid var(--border); padding: 16px; margin-bottom: 10px;
  box-shadow: var(--shadow); cursor: pointer; transition: box-shadow .15s;
}
.hist-card:active { box-shadow: var(--shadow2); }
.hist-card.ph2 { border-top: 3px solid var(--y); }
.hist-card.ph1 { border-top: 3px solid var(--text3); }
.hist-date { font-family: 'Barlow Condensed', sans-serif; font-size: 16px; font-weight: 800; letter-spacing: -.2px; }
.hist-meta { font-size: 12px; color: var(--text2); margin-top: 2px; }

/* ── STATS ── */
.stat-row { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; margin-bottom: 14px; }
.stat {
  background: var(--card); border-radius: 12px; border: 1px solid var(--border);
  padding: 12px 8px; text-align: center; box-shadow: var(--shadow);
}
.stat-v { font-family: 'Barlow Condensed', sans-serif; font-size: 26px; font-weight: 900; letter-spacing: -.5px; line-height: 1; }
.stat-l { font-family: 'Barlow Condensed', sans-serif; font-size: 10px; color: var(--text2); text-transform: uppercase; letter-spacing: .5px; margin-top: 3px; }
.stat-g { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
.stat-g .stat .stat-v { font-size: 28px; }

/* ── PR ROW ── */
.pr-row { display: flex; justify-content: space-between; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--border); }
.pr-row:last-child { border-bottom: none; }
.pr-name { font-size: 13px; font-weight: 600; }
.pr-muscle { font-size: 11px; color: var(--text2); }
.pr-val { font-family: 'Barlow Condensed', sans-serif; font-size: 18px; font-weight: 900; color: var(--text); }

/* ── PHASE BAR ── */
.phase-bar-bg { background: var(--border); border-radius: 8px; height: 20px; overflow: hidden; }
.phase-bar-fill {
  height: 100%; background: linear-gradient(90deg, var(--blk), var(--y));
  border-radius: 8px; transition: width .6s ease;
  display: flex; align-items: center; justify-content: flex-end; padding-right: 8px;
}
.phase-bar-fill span { font-family: 'Barlow Condensed', sans-serif; font-size: 11px; font-weight: 800; color: var(--blk); }

/* ── FLAGS ── */
.flag { padding: 10px 14px; border-radius: 10px; font-size: 12px; margin-bottom: 6px; font-weight: 500; line-height: 1.4; }
.flag-red { background: rgba(255,45,45,.07); border-left: 4px solid var(--red); color: var(--red); }
.flag-green { background: rgba(0,170,68,.07); border-left: 4px solid var(--green); color: var(--green); }
.flag-amber { background: rgba(255,136,0,.07); border-left: 4px solid var(--amber); color: var(--amber); }
.flag-y { background: rgba(255,214,0,.1); border-left: 4px solid var(--y); color: #806000; }
[data-dark] .flag-y { color: var(--y); }

/* ── MODAL ── */
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 300; display: flex; align-items: flex-end; }
.modal {
  background: var(--card); border-radius: 20px 20px 0 0;
  padding: 22px 20px; width: 100%; max-height: 92vh; overflow-y: auto;
  border-top: 3px solid var(--y);
}
.modal-handle { width: 40px; height: 4px; background: var(--border2); border-radius: 2px; margin: 0 auto 16px; }
.modal-title { font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 900; letter-spacing: -.3px; margin-bottom: 16px; }

/* ── RECOVERY ── */
.rec-item { display: flex; align-items: flex-start; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); }
.rec-item:last-child { border-bottom: none; }
.rec-cb { width: 24px; height: 24px; border-radius: 7px; border: 2px solid var(--border2); cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: var(--card2); margin-top: 1px; transition: all .15s; }
.rec-cb.on { background: var(--y); border-color: var(--y); }
.rec-cb.on::after { content: '✓'; color: var(--blk); font-size: 14px; font-weight: 900; font-family: 'Barlow Condensed', sans-serif; }
.rec-label { font-weight: 600; font-size: 13px; }
.rec-sub { font-size: 11px; color: var(--text2); margin-top: 1px; }
.rec-tag { display: inline-flex; align-items: center; font-family: 'Barlow Condensed', sans-serif; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 5px; background: rgba(0,170,68,.1); color: var(--green); margin: 2px; text-transform: uppercase; letter-spacing: .3px; }

/* ── CHART ── */
.chart-wrap { position: relative; height: 180px; margin: 8px 0; }

/* ── MUSCLE BAR ── */
.muscle-bar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
.muscle-bar-label { font-size: 12px; min-width: 90px; font-weight: 600; }
.muscle-bar-bg { flex: 1; background: var(--border); border-radius: 4px; height: 8px; overflow: hidden; }
.muscle-bar-fill { height: 100%; border-radius: 4px; transition: width .5s; }
.muscle-bar-pct { font-family: 'Barlow Condensed', sans-serif; font-size: 12px; font-weight: 700; color: var(--text2); min-width: 28px; text-align: right; }

/* ── CALENDAR ── */
.cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.cal-month { font-family: 'Barlow Condensed', sans-serif; font-size: 20px; font-weight: 900; letter-spacing: -.3px; }
.cal-nav { width: 32px; height: 32px; border-radius: 8px; border: 1.5px solid var(--border); background: var(--card); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; color: var(--text); }
.cal-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 3px; }

.cal-day {

}
.cal-day:hover { border-color: var(--y); }
.cal-day.empty { cursor: default; }
.cal-day.today { border-color: var(--y); background: rgba(255,214,0,.1); }
.cal-day.has-workout { background: var(--blk); color: #fff; }
[data-dark] .cal-day.has-workout { background: var(--y); color: var(--blk); }
.cal-day.has-workout .cal-type-dot { display: none; }
.cal-day.has-recovery { border-color: var(--green); }
.cal-day.has-recovery::after { content:''; position:absolute; bottom:3px; right:3px; width:5px; height:5px; border-radius:50%; background:var(--green); }
.cal-day.next-session { border-color: var(--green); background: rgba(0,170,68,.08); }
.cal-day.other-month { opacity: .3; }

.cal-day.is-off-day { background: rgba(239,68,68,.05); opacity:.5; }
.cal-day.is-off-day .cal-day-num { color: var(--text3); }

.cal-type-dot { width: 5px; height: 5px; border-radius: 50%; margin-top: 2px; }

.cal-legend { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.cal-legend-item { display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--text2); }
.cal-legend-dot { width: 8px; height: 8px; border-radius: 2px; }

.cal-upcoming-row {

// ─── SESSION ROTATION SCHEDULE ────────────────────────────────────────────────

const SESSION_ORDER=['Push','Pull','Legs','UpperB','Mobility'];
const OFF_DAYS=[0,3]; // 0=Sunday, 3=Wednesday — rest days
function isOffDay(d){return OFF_DAYS.includes(new Date(d+'T12:00:00').getDay());}
function getNextSessions(count=14){
  const data=wLoad().filter(w=>w.date>=P2_START);
  const lastType=data.length?data[data.length-1].type:'Mobility';
  const lastIdx=SESSION_ORDER.indexOf(lastType);
  const result=[];
  const today=new Date();
  let dayOffset=1;
  let sessionIdx=(lastIdx+1)%SESSION_ORDER.length;
  while(result.length<count){
    const d=new Date(today);d.setDate(d.getDate()+dayOffset);
    const dateStr=d.toISOString().split('T')[0];
    if(!isOffDay(dateStr)){
      result.push({date:dateStr,type:SESSION_ORDER[sessionIdx],isNext:result.length===0});
      sessionIdx=(sessionIdx+1)%SESSION_ORDER.length;
    }
    dayOffset++;
    if(dayOffset>60)break;
  }
  return result;
}

// ─── TIMER ────────────────────────────────────────────────────────────────────
let tSec=0,tTgt=0,tRun=false,tInt=null;
const tFmt=s=>{const n=s<0;const a=Math.abs(s);return(n?'-':'')+Math.floor(a/60)+':'+(a%60<10?'0':'')+a%60;};
const tUpd=()=>{
  const d=tFmt(tSec);
  const cls='timer-display'+(tRun?' run':tSec<0?' done':'');
  document.querySelectorAll('.timer-display').forEach(e=>{e.textContent=d;e.className=cls;});
  // Sync float timer
  const ft=document.getElementById('float-timer-disp');
  if(ft){ft.textContent=d;ft.className=cls;}
};
function setTimer(s,el){
  tSec=s;tTgt=s;tRun=false;
  if(tInt){clearInterval(tInt);tInt=null;}
  tUpd();
  document.querySelectorAll('.t-pre').forEach(p=>p.classList.remove('on'));
  document.querySelectorAll('.timer-btn').forEach(b=>b.textContent='Start');
  if(el)el.classList.add('on');
}
// ─── AUDIO BEEP CONTEXT ─────────────────────────────────────────────────────
let _audioCtx=null;
function getAudioCtx(){if(!_audioCtx)_audioCtx=new(window.AudioContext||window.webkitAudioContext)();return _audioCtx;}
function playBeep(freq=880,dur=0.25,vol=0.8,type='sine'){
  try{
    const ctx=getAudioCtx();
    const o=ctx.createOscillator();const g=ctx.createGain();
    o.connect(g);g.connect(ctx.destination);
    o.type=type;o.frequency.setValueAtTime(freq,ctx.currentTime);
    g.gain.setValueAtTime(vol,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01,ctx.currentTime+dur);
    o.start(ctx.currentTime);o.stop(ctx.currentTime+dur);
  }catch(e){}
}
function playTimerDone(){
  // 3 ascending beeps — gym-style alert
  playBeep(660,0.15,0.9);
  setTimeout(()=>playBeep(880,0.15,0.9),200);
  setTimeout(()=>playBeep(1100,0.4,1.0),400);
  if(navigator.vibrate)navigator.vibrate([400,100,400,100,400]);
}

function startStopTimer(){
  if(tRun){
    clearInterval(tInt);tInt=null;tRun=false;
    document.querySelectorAll('.timer-btn').forEach(b=>b.textContent='Resume');
  } else {
    tRun=true;
    // Unlock audio on user interaction
    try{getAudioCtx().resume();}catch(e){}
    document.querySelectorAll('.timer-btn').forEach(b=>b.textContent='Pause');
    tInt=setInterval(()=>{
      tSec--;tUpd();
      if(tSec===0){
        playTimerDone();
      }
    },1000);
  }
}
function resetTimer(){
  clearInterval(tInt);tInt=null;tRun=false;
  tSec=0;tTgt=0;
  document.querySelectorAll('.t-pre').forEach(p=>p.classList.remove('on'));
  document.querySelectorAll('.timer-btn').forEach(b=>b.textContent='Start');
  tUpd();
}
function timerHTML(){
  return`<div class="timer-wrap">
    <div class="timer-display">0:00</div>
    <div style="flex:1;">
      <div class="timer-presets">
        <div class="t-pre" onclick="setTimer(60,this)">1:00</div>
        <div class="t-pre" onclick="setTimer(90,this)">1:30</div>

      </div>
    </div>
  </div>`;
}

function dragStart(e,i,ctx){dragIdx=i;e.target.classList.add('dragging');e.dataTransfer.effectAllowed='move';}
function dragOver(e,i,ctx){e.preventDefault();document.querySelectorAll('.ex-card,.log-ex').forEach(el=>el.classList.remove('drag-over'));e.currentTarget.classList.add('drag-over');}
function dragDrop(e,i,ctx){
  e.preventDefault();
  if(dragIdx===null||dragIdx===i)return;
  if(ctx==='prog'){const a=PROG[currentDayKey].exercises;const[m]=a.splice(dragIdx,1);a.splice(i,0,m);renderProgContent();}
  else if(ctx==='log'){const[m]=currentExercises.splice(dragIdx,1);currentExercises.splice(i,0,m);renderLogExercises();}
  dragIdx=null;
}
function dragEnd(e){e.target.classList.remove('dragging');document.querySelectorAll('.ex-card,.log-ex').forEach(el=>el.classList.remove('drag-over'));dragIdx=null;}

// ─── PREV BEST ────────────────────────────────────────────────────────────────
function getPrev(name){
  const d=wLoad().slice().sort((a,b)=>b.date.localeCompare(a.date));
  for(const w of d){
    const ex=w.exercises.find(e=>e.name===name);
    if(ex&&ex.sets.length){
      const kg=Math.max(...ex.sets.map(s=>+s.kg||0));
      const reps=ex.sets.map(s=>s.r||'—').join('/');
      return{date:w.date,kg,reps,sets:ex.sets.length};
    }
  }return null;
}

function addEx(){
  const n=document.getElementById('new-ex-name')?.value.trim();

  document.getElementById('new-ex-name').value='';
  renderLogExercises();saveDraft();
}
function addSet(i){const l=currentExercises[i].sets.slice(-1)[0]||{};currentExercises[i].sets.push({r:'',kg:'',t:l.t||'',n:''});currentExercises[i].saved=false;renderLogExercises();saveDraft();}
function dupSet(i,si){const s={...currentExercises[i].sets[si]};currentExercises[i].sets.splice(si+1,0,s);currentExercises[i].saved=false;renderLogExercises();saveDraft();}
function rmSet(i,si){if(currentExercises[i].sets.length<=1)return;currentExercises[i].sets.splice(si,1);renderLogExercises();saveDraft();}
function rmEx(i){currentExercises.splice(i,1);renderLogExercises();saveDraft();}
function eSet(i,si,f,v){currentExercises[i].sets[si][f]=v;currentExercises[i].saved=false;saveDraft();}
function saveEx(i){currentExercises[i].saved=true;saveDraft();const el=document.getElementById('sv-'+i);if(el)el.textContent='✓ Saved';}
function subEx(i){
  const el=document.getElementById('alt-sel-'+i);
  if(!el||!el.value)return;
  currentExercises[i].name=el.value;currentExercises[i].alts=ALT_MAP[el.value]||[];
  renderLogExercises();saveDraft();
}
function saveDraft(){
  const d=document.getElementById('log-date');const t=document.getElementById('log-type');
  localStorage.setItem(DK,JSON.stringify({exercises:currentExercises,type:t?.value||'',date:d?.value||'',editingId}));
}
function getPrevHistory(exName){
  // Get last 5 sessions for this exercise, sorted best to worst by top weight
  const data=wLoad().slice().sort((a,b)=>b.date.localeCompare(a.date));
  const results=[];
  for(const w of data){
    const ex=w.exercises.find(e=>e.name===exName);
    if(ex&&ex.sets&&ex.sets.length){
      const validSets=ex.sets.filter(s=>s.r||s.kg);
      if(!validSets.length)continue;
      const topKg=Math.max(...validSets.map(s=>+s.kg||0));
      const repsStr=validSets.map(s=>s.r||'?').join('/');
      results.push({date:w.date,topKg:topKg||0,repsStr,sets:validSets.length,allSets:validSets,wkId:w.id});
    }
    if(results.length>=5)break;
  }
  // Sort by top weight desc, then by date desc as tiebreaker
  return results.sort((a,b)=>b.topKg-a.topKg||b.date.localeCompare(a.date));
}

function pasteHistorySession(idx,histIdx){
  const ex=currentExercises[idx];
  const hist=getPrevHistory(ex.name);
  if(!hist.length||histIdx>=hist.length)return;
  const chosen=hist[histIdx];
  // Paste all sets from that session
  currentExercises[idx].sets=chosen.allSets.map(s=>({...s}));
  currentExercises[idx].saved=false;
  renderLogExercises();saveDraft();
  setTimeout(()=>{
    const el=document.getElementById('sv-'+idx);
    if(el){el.textContent='⚡ Pasted from '+fmtD(chosen.date,true)+' ('+chosen.topKg+'kg)';el.style.color='var(--amber)';}
  },80);
}

function copyLastSets(idx){
  const ex=currentExercises[idx];
  const prev=getPrev(ex.name);
  if(!prev)return;
  // Find the full previous workout sets
  const data=wLoad().slice().sort((a,b)=>b.date.localeCompare(a.date));
  for(const w of data){
    const pex=w.exercises.find(e=>e.name===ex.name);
    if(pex&&pex.sets.length){
      // Copy all sets from previous session into current
      currentExercises[idx].sets=pex.sets.map(s=>({...s}));
      currentExercises[idx].saved=false;
      renderLogExercises();
      saveDraft();
      // Flash confirmation
      setTimeout(()=>{
        const el=document.getElementById('sv-'+idx);
        if(el){el.textContent='⚡ Copied from '+fmtD(w.date,true);el.style.color='var(--amber)';}
      },100);
      return;
    }
  }
}

function calcDuration(){
  const start=document.getElementById('log-time')?.value;
  const end=document.getElementById('log-end-time')?.value;
  const el=document.getElementById('log-duration');
  if(!start||!end||!el){return;}
  const [sh,sm]=start.split(':').map(Number);
  const [eh,em]=end.split(':').map(Number);
  let mins=(eh*60+em)-(sh*60+sm);
  if(mins<0)mins+=1440;
  const h=Math.floor(mins/60),m=mins%60;
  el.textContent=h>0?`${h}h ${m}m`:`${m}m`;
}

function saveWorkout(){
  const date=document.getElementById('log-date')?.value;
  const time=document.getElementById('log-time')?.value;
  // Auto-capture end time NOW when user presses save
  const nowEnd=new Date();
  const autoEnd=String(nowEnd.getHours()).padStart(2,'0')+':'+String(nowEnd.getMinutes()).padStart(2,'0');
  const endTimeEl=document.getElementById('log-end-time');
  const endTime=endTimeEl?.value||autoEnd;
  if(endTimeEl&&!endTimeEl.value)endTimeEl.value=autoEnd;
  const type=document.getElementById('log-type')?.value;
  const notes=document.getElementById('log-notes')?.value||'';
  const rec=document.getElementById('log-rec')?.value||'';
  if(!date){alert('Select a date');return;}
  if(!currentExercises.length){alert('Add at least one exercise');return;}
  // calc duration
  let durationMins=null;
  if(time&&endTime){
    const[sh,sm]=time.split(':').map(Number);const[eh,em]=endTime.split(':').map(Number);
    let mins=(eh*60+em)-(sh*60+sm);if(mins<0)mins+=1440;durationMins=mins;
  }
  const data=wLoad();
  const w={id:editingId||('w'+Date.now()),date,time,endTime,durationMins,type,notes,recovery:rec,phase:getPhase(date),
    exercises:currentExercises.map(ex=>({name:ex.name,muscle:ex.muscle,ssLabel:ex.ssLabel||null,
      sets:ex.sets.filter(s=>s.r||s.kg||s.n)}))};
  if(editingId){const i=data.findIndex(x=>x.id===editingId);if(i>=0)data[i]=w;else data.push(w);}
  else data.push(w);
  data.sort((a,b)=>a.date.localeCompare(b.date));
  wSave(data);localStorage.removeItem(DK);
  editingId=null;currentExercises=[];
  syncToGSheet();
  alert('✓ Workout saved!');showPg('history');
}

let calDragWkId=null;

function renderCalGrid(){
  const months=['January','February','March','April','May','June','July','August','September','October','November','December'];
  const dows=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  document.getElementById('cal-month-label').textContent=months[calMonth]+' '+calYear;
  const data=wLoad();const workoutsByDate={};
  data.forEach(w=>{workoutsByDate[w.date]=(workoutsByDate[w.date]||[]).concat(w);});
  const recAll=rLoad();
  const calCustom=cLoad();
  const nextSessions=getNextSessions(14);
  const nextDates={};nextSessions.forEach(s=>{nextDates[s.date]=s;});
  const today=new Date().toISOString().split('T')[0];
  const firstDay=new Date(calYear,calMonth,1);
  const lastDay=new Date(calYear,calMonth+1,0);
  let startDow=firstDay.getDay();if(startDow===0)startDow=7;startDow--;
  let html=dows.map(d=>`<div class="cal-dow">${d}</div>`).join('');
  for(let i=0;i<startDow;i++)html+=`<div class="cal-day empty other-month"></div>`;
  for(let d=1;d<=lastDay.getDate();d++){
    const dateStr=`${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const wks=workoutsByDate[dateStr];
    const recDay=recAll[dateStr];
    const custom=calCustom[dateStr];
    const isToday=dateStr===today;
    const isNext=nextDates[dateStr];
    const hasWk=wks&&wks.length>0;
    const hasCustom=custom&&custom.type;
    // Recovery: any item done counts as a recovery day
    const hasRec=recDay&&Object.values(recDay).some(v=>v&&v.done);
    let cls='cal-day';
    if(isToday)cls+=' today';
    if(hasWk)cls+=' has-workout';
    else if(isNext&&!hasCustom)cls+=' next-session';
    if(hasRec&&!hasWk)cls+=' has-recovery';
    const typeToShow=hasWk?wks[0].type:(hasCustom?custom.type:(isNext?isNext.type:null));
    const color=typeToShow?CAL_COLORS[typeToShow]:'transparent';
    const wkId=hasWk?wks[0].id:null;
    const isOff=isOffDay(dateStr);
    if(isOff&&!hasWk)cls+=' is-off-day';
    html+=`<div class="${cls}"
      onclick="calDayClick('${dateStr}')"
      draggable="${hasWk?'true':'false'}"
      ondragstart="${hasWk?`calDragStart(event,'${wkId}','${dateStr}')`:''}"
      ondragover="calDragOver(event)"
      ondragleave="calDragLeave(event)"
      ondrop="calDrop(event,'${dateStr}')"
      oncontextmenu="calLongPress(event,'${dateStr}');return false;"
      ontouchstart="calTouchStart(event,'${dateStr}')"
      ontouchend="calTouchEnd(event)"
      data-date="${dateStr}">
      <div class="cal-day-num">${d}</div>
      ${isOff&&!hasWk?'<div class="cal-off-label">off</div>':''}
      ${typeToShow&&!isOff||hasWk?`<div class="cal-type-dot" style="background:${color};"></div><div class="cal-type-label" style="color:${hasWk?'#fff':color};">${typeToShow.substring(0,3)}</div>`:''}
    </div>`;
  }

}

function confirmReschedule(wkId,fromDate,toDate,realign){
  const reason=document.getElementById('reschedule-reason')?.value||'';
  const data=wLoad();
  const idx=data.findIndex(x=>x.id===wkId);
  if(idx<0)return;
  const ms=new Date(toDate+'T12:00:00')-new Date(fromDate+'T12:00:00');
  const dayDiff=Math.round(ms/(864e5));
  // Store reschedule log in the workout
  data[idx].date=toDate;
  data[idx].rescheduled={from:fromDate,to:toDate,reason,date:new Date().toISOString()};
  if(realign&&dayDiff!==0){
    // Shift all FUTURE workouts by same number of days, skip the moved one
    for(let i=0;i<data.length;i++){
      if(data[i].id===wkId)continue;
      const wDate=data[i].date;
      // Only shift workouts that come after the EARLIER of the two dates
      const pivot=dayDiff>0?fromDate:toDate;
      if(wDate>pivot){
        const d=new Date(wDate+'T12:00:00');
        d.setDate(d.getDate()+dayDiff);
        data[i].date=d.toISOString().split('T')[0];
        if(!data[i].realignNote)data[i].realignNote=[];
        data[i].realignNote.push(`Auto-shifted ${dayDiff>0?'+':''}${dayDiff}d — reschedule of ${fromDate}→${toDate}${reason?' "'+reason+'"':''}`);
      }
    }
  }
  data.sort((a,b)=>a.date.localeCompare(b.date));
  wSave(data);
  syncToGSheet();
  document.querySelectorAll('.overlay').forEach(o=>o.remove());
  renderCalGrid();renderCalUpcoming();renderCalThisWeek();
  alert(`✓ Moved to ${fmtD(toDate)}${realign?' — following sessions realigned':''}.${reason?' Reason: '+reason:''}`);
}

function buildExMap(){
  const map={};
  wLoad().forEach(w=>w.exercises.forEach(ex=>{
    if(!map[ex.name])map[ex.name]={muscle:ex.muscle,entries:[]};
    const top=Math.max(...ex.sets.map(s=>+s.kg||0));
    if(top>0)map[ex.name].entries.push({date:w.date,kg:Math.round(top*10)/10,phase:getPhase(w.date)});
  }));
  return map;
}

function renderBuildupAnalysis(map,ph2){
  const el=document.getElementById('buildup-wrap');if(!el)return;
  const ins=[];
  const now=new Date(),p2Start=new Date(P2_START),p2End=new Date('2026-06-29T12:00:00');
  const daysLeft=Math.max(0,Math.round((p2End-now)/864e5));

  ins.push({t:`📅 Phase 2 ends ~Jun 29 — ${daysLeft} days left. These are final-stretch consolidation goals, not fresh 12-week ramps. Most original targets have already been met.`,c:'y'});

  // ── NECK STATUS ──
  const recentNeck=ph2.filter(w=>w.date>='2026-06-01').some(w=>(w.notes||'').toLowerCase().includes('neck')||(w.notes||'').toLowerCase().includes('trap'));
  if(!recentNeck)ins.push({t:'✅ Neck & trap: Clear through June. The April flare fully resolved. Keep chin tucks daily — prevention, not just treatment.',c:'green'});
  else ins.push({t:'⚠ Neck/trap mentioned recently (Jun 15: "trap and neck were locked 2 days ago"). Isolated, not a full flare — but stay alert. Chin tucks 3× daily.',c:'amber'});

  // ── CHEST PRESS ──
  const cp=map['Barbell Chest Press'];
  if(cp){const e=cp.entries.filter(x=>x.date>=P2_START);if(e.length){
    const best=Math.max(...e.map(x=>x.kg));
    ins.push({t:`Chest press: 60→${best}kg (+${((best/60-1)*100).toFixed(0)}%) over the phase. Top set now 65kg for 5-6 reps at near-failure. Final stretch: one clean attempt at 67.5kg, or hold 65kg for 3 solid reps. Either is a real win to close the phase on.`,c:'green'});
  }}

  // ── SHOULDER PRESS — TARGET MET ──
  const sp=map['Standing DB Shoulder Press'];
  if(sp){const e=sp.entries.filter(x=>x.date>=P2_START);if(e.length){
    const best=Math.max(...e.map(x=>x.kg));
    ins.push({t:`Shoulder press: 10→${best}kg (+50%) — TARGET MET. This was your biggest relative gain of the phase. Final stretch: consolidate 15kg for 12 clean reps across all 3 sets before chasing more weight.`,c:'green'});
  }}

  // ── LAT PULLDOWN — PLATEAU BROKEN ──
  const ld=map['Lat Pulldown'];
  if(ld){const e=ld.entries.filter(x=>x.date>=P2_START);if(e.length){
    const best=Math.max(...e.map(x=>x.kg));
    ins.push({t:`Lat pulldown: Stuck at 76.5kg for 5 weeks, then broke through to ${best}kg in June. The fix worked — pushing the last set closer to failure unlocked it. 85kg is realistic before phase end.`,c:'green'});
  }}

  // ── CABLE ROW — MAXED, REPS ONLY ──
  ins.push({t:`Cable seated row: Maxed the machine at 94kg since week 1. You're now hitting 11 clean reps across all 3 sets (Jun 15). Final push: 12 reps — that's the only progression left on this machine.`,c:'green'});

  // ── PULL-UPS — BIG GAIN ──
  ins.push({t:`Pull-ups: 18→33 total reps at peak (May 31) — nearly DOUBLED capacity. Currently sitting at ~31 total (Jun 15: 13/9/9). This is one of your standout wins of the entire phase. Target 35 total for the close.`,c:'green'});

  // ── DEADLIFT ──
  const dl=map['Barbell Deadlift'];
  if(dl){const e=dl.entries.filter(x=>x.date>=P2_START);if(e.length){
    const best=Math.max(...e.map(x=>x.kg));
    ins.push({t:`Deadlift: 75→${best}kg (+20%, plate weight — add the 20kg bar for ${best+20}kg actual). Strong, steady climb. Final: 92.5kg, technique-first given your spine history — this isn't the lift to rush in the last two weeks.`,c:'green'});
  }}

  // ── FRONT SQUAT — CAUTION FLAG ──
  const fs=map['Smith Machine Front Squat'];
  if(fs){const e=fs.entries.filter(x=>x.date>=P2_START);if(e.length){
    const best=Math.max(...e.map(x=>x.kg));
    ins.push({t:`Front squat: 70→${best}kg (+28.6%) — your fastest relative gain of the phase. Genuinely impressive, but that pace is worth a flag: HOLD at ${best}kg for the final stretch rather than pushing further. Consolidate clean form, don't chase one more PR before a deload.`,c:'amber'});
  }}

  // ── HIP THRUST ──
  ins.push({t:`Hip thrust: Capped at 40kg throughout (by design). Reps climbed 10→14 with a full 3s pause. Final: 15 reps clean — that's real glute strength even though the number on the bar hasn't moved.`,c:'green'});

  // ── RDL ──
  const rdl=map['Romanian Deadlift (RDL)'];
  if(rdl){const e=rdl.entries.filter(x=>x.date>=P2_START);if(e.length){
    const best=Math.max(...e.map(x=>x.kg));
    ins.push({t:`RDL: 55→${best}kg, now with a strict 4-second eccentric (since May 23). That tempo change is exactly where hamstring hypertrophy comes from — more important than the weight itself. Final: 62.5kg same tempo.`,c:'green'});
  }}

  // ── INCLINE DB — CAPPED ──
  ins.push({t:`Incline DB: Hit the 25kg dumbbell ceiling Apr 30. Since then it's been rep consolidation — currently 9-12 reps on set 1, dropping on sets 2-3. Final: 12 clean reps on ALL three sets, not just the first.`,c:'amber'});

  // ── RECOVERY ──
  const allRec=rLoad();const recDates=Object.keys(allRec).filter(d=>d>=P2_START);
  const whmDays=recDates.filter(d=>allRec[d].whm?.done).length;
  const coldDays=recDates.filter(d=>allRec[d].cold?.done).length;
  const pct=recDates.length?Math.round(whmDays/recDates.length*100):0;
  ins.push({t:`Recovery stack: WHM ${whmDays}/${recDates.length} days (${pct}%) · Cold exposure ${coldDays}/${recDates.length} days in Phase 2. ${pct>=75?'This consistency is one of the real reasons your strength curve has been this clean — it is not a coincidence.':'Worth tightening — recovery consistency compounds over a 12-week block.'}`,c:pct>=75?'green':'amber'});

  // ── SESSION QUALITY DISTRIBUTION ──
  ins.push({t:`Session quality across Phase 2: 23 Excellent, 18 Good, 6 Average, 1 Poor (out of 48 rated sessions). That is an 85% Good-or-better rate — a genuinely strong consistency record for a 12-week block.`,c:'green'});

  el.innerHTML=ins.map(i=>`<div class="flag flag-${i.c}" style="margin-bottom:7px;font-size:12px;">${i.t}</div>`).join('');
}

function renderProgAnalysis(map,ph2,wkDone){
  const el=document.getElementById('prog-analysis');if(!el)return;
  if(!ph2.length){el.innerHTML='<div style="color:var(--text2);font-size:12px;">No Phase 2 sessions yet.</div>';return;}
  el.innerHTML=PROG_TARGETS.map(p=>{
    const ex=map[p.ex];
    if(!ex||!ex.entries.length)return`<div style="font-size:12px;color:var(--text3);padding:5px 0;border-bottom:1px solid var(--border);">${p.ex} — not yet logged</div>`;
    const ph2e=ex.entries.filter(e=>e.date>=P2_START);
    const cur=ph2e.length?Math.max(...ph2e.map(e=>e.kg)):Math.max(...ex.entries.map(e=>e.kg));
    const curR=Math.round(cur*10)/10;
    const pctToEnd=p.end>p.start?Math.min(100,Math.round(((curR-p.start)/(p.end-p.start))*100)):100;
    const on=curR>=p.start+(p.end-p.start)*(wkDone/P2_WEEKS)*0.8;
    return`<div style="margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--border);">
      <div style="display:flex;justify-content:space-between;margin-bottom:4px;">
        <span style="font-weight:700;font-size:13px;">${p.ex}</span>
        <span style="font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;color:${on?'var(--green)':'var(--amber)'};">${on?'✓ On track':'⚠ Push it'}</span>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text2);margin-bottom:5px;">
        <span>Now: <strong style="color:var(--text);">${curR} ${p.unit}</strong></span>
        <span>Goal: ${p.end}</span>
      </div>
      <div class="prog-bar-bg"><div class="prog-bar-fill" style="width:${pctToEnd}%;background:${on?'var(--green)':'var(--amber)'};">&nbsp;</div></div>
      <div style="font-size:10px;color:var(--text3);margin-top:3px;">${pctToEnd}% toward phase goal</div>
    </div>`;
  }).join('');
}

function renderVolChart(data){
  const tc={};const cols={Push:'255,77,0',Pull:'0,102,255',Legs:'139,0,255',UpperB:'0,170,68',Mobility:'255,136,0',Other:'100,100,100'};
  data.forEach(w=>{const t=w.type||'Other';tc[t]=(tc[t]||0)+w.exercises.reduce((a,e)=>a+e.sets.reduce((b,s)=>b+(+s.r||0)*(+s.kg||0),0),0);});
  const el=document.getElementById('volChart');if(!el)return;
  if(volCh)volCh.destroy();
  volCh=new Chart(el.getContext('2d'),{
    type:'doughnut',
    data:{labels:Object.keys(tc).map(k=>k+' ('+(tc[k]/1000).toFixed(1)+'t)'),
      datasets:[{data:Object.values(tc).map(v=>Math.round(v/1000*10)/10),
        backgroundColor:Object.keys(tc).map(k=>`rgba(${cols[k]||'100,100,100'},.8)`),borderWidth:2,
        borderColor:Object.keys(tc).map(k=>`rgb(${cols[k]||'100,100,100'})`)}]},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{position:'right',labels:{font:{size:11},boxWidth:12,padding:8}}}}
  });
}

// Build per-type exercise series from live data
function buildTypeExSeries(sessionType){
  const map=buildExMap();
  const sessions=wLoad().filter(w=>w.type===sessionType);
  // collect exercise names that appear in this type AND have kg data
  const seen=new Set();
  sessions.forEach(w=>w.exercises.forEach(ex=>{
    if(map[ex.name]&&map[ex.name].entries.length>0)seen.add(ex.name);
  }));
  const names=[...seen].sort();
  if(!names.length)return{dates:[],series:{},names:[]};
  const allDates=[...new Set(names.flatMap(n=>(map[n]?.entries||[]).map(e=>e.date)))].sort();
  const series={};
  names.forEach(n=>{
    const byDate={};
    (map[n]?.entries||[]).forEach(e=>byDate[e.date]=e.kg);
    series[n]=allDates.map(d=>byDate[d]!=null?byDate[d]:null);
  });
  return{dates:allDates,series,names};
}

function buildPullupSeries2(){
  const out=[];
  wLoad().forEach(w=>{
    let total=0;
    w.exercises.forEach(ex=>{if(/Pull-Ups/i.test(ex.name))ex.sets.forEach(s=>{const r=parseFloat(s.r);if(!isNaN(r))total+=r;});});
    if(total>0)out.push({date:w.date,total,type:w.type||'Other'});
  });
  return out.sort((a,b)=>a.date.localeCompare(b.date));
}
function buildWeeklyRecovery2(){
  const rec=rLoad();const start=new Date(P2_START);const weeks={};
  Object.keys(rec).forEach(d=>{
    if(d<P2_START)return;
    const dt=new Date(d+'T12:00:00');const wk=Math.floor((dt-start)/(7*864e5))+1;
    if(wk<1)return;
    if(!weeks[wk])weeks[wk]={whm:0,cold:0,total:0};
    weeks[wk].total++;
    if(rec[d].whm?.done)weeks[wk].whm++;
    if(rec[d].cold?.done)weeks[wk].cold++;
  });
  return Object.keys(weeks).map(Number).sort((a,b)=>a-b).map(wk=>({week:wk,whmPct:Math.round(weeks[wk].whm/weeks[wk].total*100),coldPct:Math.round(weeks[wk].cold/weeks[wk].total*100)}));
}
function buildSessionTypeCounts2(){
  const counts={};
  wLoad().filter(w=>getPhase(w.date)==='Phase2').forEach(w=>{const t=w.type||'Other';counts[t]=(counts[t]||0)+1;});
  return counts;
}
function findBiggestGain2(){
  const map=buildExMap();
  let best=null;
  Object.entries(map).forEach(([name,v])=>{
    const ph2=v.entries.filter(e=>e.phase==='Phase2').sort((a,b)=>a.date.localeCompare(b.date));
    if(ph2.length<2)return;
    const pct=ph2[0].kg>0?Math.round((ph2[ph2.length-1].kg-ph2[0].kg)/ph2[0].kg*100):0;
    if(!best||pct>best.pct)best={name,first:ph2[0].kg,last:ph2[ph2.length-1].kg,pct,count:ph2.length};
  });
  return best;
}
function pullupPeakReps(){
  const s=buildPullupSeries2().filter(e=>e.date>=P2_START);
  if(!s.length)return null;
  return Math.max(...s.map(e=>e.total));
}

function renderProgEachExercise(){
  const map=buildExMap();
  const wrap=document.getElementById('prog-ex-chart-wrap');
  const tbl=document.getElementById('prog-ex-table');
  if(!wrap)return;
  progEachChs.forEach(ch=>{try{ch.destroy();}catch(e){}});progEachChs=[];

  // Gather all exercises: sort by type order then name
  const typeOrder={Push:0,Pull:1,Legs:2,UpperB:3};
  const allData=wLoad();
  // Build: exName → {muscle, type (from first session it appears in), entries}
  const exMeta={};
  allData.forEach(w=>{
    w.exercises.forEach(ex=>{
      if(!exMeta[ex.name])exMeta[ex.name]={muscle:ex.muscle,type:w.type||'Other'};
    });
  });

  const exercises=Object.entries(map)
    .filter(([,v])=>v.entries.length>=2) // need at least 2 points to chart
    .map(([name,v])=>({name,muscle:v.muscle,entries:v.entries,type:exMeta[name]?.type||'Other'}))
    .sort((a,b)=>{
      const ta=typeOrder[a.type]??9,tb=typeOrder[b.type]??9;
      if(ta!==tb)return ta-tb;
      return a.name.localeCompare(b.name);
    });

  if(!exercises.length){
    wrap.innerHTML='<div style="font-size:12px;color:var(--text2);padding:10px 0;">No exercises with enough data yet.</div>';
    return;
  }

  let lastType='';
  const cards=exercises.map((ex,idx)=>{
    const ph2=ex.entries.filter(e=>e.phase==='Phase2');
    const allE=ex.entries.sort((a,b)=>a.date.localeCompare(b.date));
    const first=allE[0].kg,last=allE[allE.length-1].kg,peak=Math.max(...allE.map(e=>e.kg));
    const pct=first>0?Math.round((last-first)/first*100):0;
    const col=pct>10?'var(--green)':pct<-5?'var(--red)':'var(--text2)';
    const typeLabel=ex.type!==lastType?`<div style="font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:${PROG_TYPE_COLORS[ex.type]||'#888'};padding:14px 0 6px;">${ex.type}</div>`:'';
    lastType=ex.type;
    return typeLabel+`<div style="background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px;">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;">
        <div>
          <div style="font-size:14px;font-weight:800;line-height:1.2;">${ex.name}</div>
          <div style="font-size:11px;color:var(--text2);margin-top:2px;">${ex.muscle}</div>
        </div>
        <div style="text-align:right;">
          <div style="font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:900;line-height:1;color:${col};">${pct>=0?'+':''}${pct}%</div>
          <div style="font-size:10px;color:var(--text2);">${first}→${last}kg</div>
        </div>
      </div>
      <div style="height:120px;position:relative;"><canvas id="each_ch_${idx}"></canvas></div>
      <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--text2);margin-top:8px;">
        <span>${allE.length} session${allE.length!==1?'s':''} total${ph2.length?' · '+ph2.length+' in Ph2':''}</span>
        <span>Peak: <strong>${peak}kg</strong></span>
      </div>
    </div>`;
  }).join('');

  wrap.innerHTML=cards;
  tbl.innerHTML='';

  // Now instantiate all charts after DOM is ready
  exercises.forEach((ex,idx)=>{
    const el=document.getElementById('each_ch_'+idx);if(!el)return;
    const allE=ex.entries.sort((a,b)=>a.date.localeCompare(b.date));
    const col=CHART_PALETTE[idx%CHART_PALETTE.length];
    const ALPHA_MAP={'#FF2D2D':'rgba(255,45,45,.12)','#0066FF':'rgba(0,102,255,.12)','#FF8800':'rgba(255,136,0,.12)','#00AA44':'rgba(0,170,68,.12)','#8B00FF':'rgba(139,0,255,.12)','#00B8B8':'rgba(0,184,184,.12)','#FFD600':'rgba(255,214,0,.12)','#FF6B9D':'rgba(255,107,157,.12)','#00CC88':'rgba(0,204,136,.12)','#FF5500':'rgba(255,85,0,.12)','#7B68EE':'rgba(123,104,238,.12)','#20B2AA':'rgba(32,178,170,.12)','#FF1493':'rgba(255,20,147,.12)','#32CD32':'rgba(50,205,50,.12)','#FF8C00':'rgba(255,140,0,.12)','#9370DB':'rgba(147,112,219,.12)'};
    const bg=ALPHA_MAP[col]||'rgba(100,100,100,.12)';
    const ch=new Chart(el.getContext('2d'),{
      type:'line',
      data:{
        labels:allE.map(e=>fmtD(e.date,true)),

  const max=Math.max(...entries.map(([,c])=>c));
  el.innerHTML=entries.map(([type,count])=>`
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;">
      <div style="font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;width:62px;flex-shrink:0;">${type}</div>
      <div style="flex:1;height:16px;background:var(--border);border-radius:8px;overflow:hidden;">
        <div style="height:100%;border-radius:8px;width:${Math.round(count/max*100)}%;background:${PROG_TYPE_COLORS[type]||'#888'};display:flex;align-items:center;justify-content:flex-end;padding-right:6px;">
          <span style="font-size:9px;font-weight:800;color:#fff;font-family:'Barlow Condensed',sans-serif;">${count}</span>
        </div>
      </div>
    </div>`).join('');
}

function renderProgInsights2(){
  const el=document.getElementById('progInsights2');if(!el)return;
  const ins=[];
  const gain=findBiggestGain2();
  if(gain&&gain.pct>0)ins.push({t:`${gain.name}: ${gain.first}→${gain.last}kg (+${gain.pct}%) across ${gain.count} Phase 2 sessions — your biggest percentage move.`,c:'green'});
  // find most-improved in each type
  PROG_TYPES.forEach(type=>{
    const{names}=buildTypeExSeries(type);
    const map=buildExMap();
    let best=null;
    names.forEach(n=>{
      const ph2e=(map[n]?.entries||[]).filter(e=>e.phase==='Phase2').sort((a,b)=>a.date.localeCompare(b.date));
      if(ph2e.length<3)return;
      const pct=ph2e[0].kg>0?Math.round((ph2e[ph2e.length-1].kg-ph2e[0].kg)/ph2e[0].kg*100):0;
      if(pct>0&&(!best||pct>best.pct))best={name:n,pct,first:ph2e[0].kg,last:ph2e[ph2e.length-1].kg,count:ph2e.length};
    });
    if(best&&best.name!==gain?.name)ins.push({t:`${type} day leader: ${best.name} ${best.first}→${best.last}kg (+${best.pct}%)`,c:'y'});
  });
  const weekly=buildWeeklyRecovery2();
  if(weekly.length){
    const avgWhm=Math.round(weekly.reduce((a,w)=>a+w.whmPct,0)/weekly.length);
    ins.push({t:`WHM consistency: ${avgWhm}% of Phase 2 days. ${avgWhm>=85?'Rock solid \u2014 directly underwriting the strength gains.':'Room to tighten. It tends to show in the numbers.'}`,c:avgWhm>=85?'green':'amber'});
  }
  if(!ins.length){el.innerHTML='<div style="font-size:12px;color:var(--text2);">Log a few more sessions and this fills in automatically.</div>';return;}
  el.innerHTML=ins.map(i=>`<div class="flag flag-${i.c}">${i.t}</div>`).join('');
}

// ─── GOOGLE SHEETS SYNC ─────────────────────────────────────────────────────
// Lets the app push a full backup to a Google Apps Script Web App URL the
// user deploys themselves (see Profile page for the script + instructions).
// Uses mode:'no-cors' since Apps Script doesn't return readable CORS headers —
// this still successfully delivers the POST, we just can't read the response.
let _gsheetSyncTimer=null;
function getGSheetUrl(){return (pLoad().gsheetUrl||'').trim();}
function syncToGSheetNow(){
  const url=getGSheetUrl();
  if(!url)return;
  const backup={version:'v5',exported:new Date().toISOString(),workouts:wLoad(),recovery:rLoad(),profile:(()=>{const p=pLoad();const{photoUrl,...rest}=p;return rest;})()};
  try{
    fetch(url,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify(backup)}).catch(()=>{});
    const el=document.getElementById('gsheet-status');
    if(el){el.textContent='✓ Synced '+new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});el.style.color='var(--green)';}
  }catch(e){
    const el=document.getElementById('gsheet-status');
    if(el){el.textContent='Sync failed — check URL';el.style.color='var(--red)';}
  }
}
function syncToGSheet(){
  // Debounced — fires 1.5s after the last save so rapid edits don't spam requests
  clearTimeout(_gsheetSyncTimer);
  _gsheetSyncTimer=setTimeout(syncToGSheetNow,1500);
}
function saveGSheetUrl(){
  const inp=document.getElementById('gsheet-url-inp');
  if(!inp)return;
  const p=pLoad();p.gsheetUrl=inp.value.trim();pSave(p);
  const el=document.getElementById('gsheet-status');
  if(el){el.textContent='URL saved.';el.style.color='var(--text2);';}
}
function testGSheetSync(){
  const el=document.getElementById('gsheet-status');
  if(el){el.textContent='Sending test sync…';el.style.color='var(--text2)';}
  syncToGSheetNow();
}
function restoreFromGSheet(){
  const url=getGSheetUrl();
  if(!url){alert('Add your Google Sheets Web App URL first.');return;}
  const el=document.getElementById('gsheet-status');
  if(el){el.textContent='Fetching latest backup…';el.style.color='var(--text2)';}
  fetch(url).then(r=>r.text()).then(txt=>{
    const d=JSON.parse(txt);
    if(d.status==='empty'){alert('No backups found on the sheet yet.');return;}
    if(d.workouts)wSave(d.workouts);
    if(d.recovery)rSave(d.recovery);
    if(d.profile){const p=pLoad();pSave({...d.profile,...{gsheetUrl:p.gsheetUrl}});}
    alert(`✅ Restored from Google Sheets: ${(d.workouts||[]).length} workouts · ${Object.keys(d.recovery||{}).length} recovery days`);
    renderHistoryPage();
  }).catch(e=>{
    if(el){el.textContent='Restore failed — check URL and deployment.';el.style.color='var(--red)';}
  });
}

function exportTxt(){
  const data=wLoad();const all=rLoad();const prof=pLoad();const map=buildExMap();
  const prs=Object.entries(map).filter(([,v])=>v.entries.length).map(([n,v])=>({n,pr:Math.round(Math.max(...v.entries.map(e=>e.kg))*10)/10,m:v.muscle})).sort((a,b)=>b.pr-a.pr);
  let txt=`BASH TRAINING | PHASE 2\nGenerated: ${new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}\n`;
  txt+=`Profile: ${prof.name||'Bechara'} · Age ${calcAge(prof.dob)} · ${prof.height||173}cm · ${prof.weight||77.8}kg · BMI ${calcBMI(prof.height||173,prof.weight||77.8)}\n\n`;
  txt+=`PERSONAL RECORDS\n${prs.map(p=>`${p.n.padEnd(35)} ${p.pr}kg [${p.m}]`).join('\n')}\n\n`;
  txt+=`SESSION LOG\n`;
  data.slice().reverse().forEach(w=>{
    txt+=`\n${fmtD(w.date)}${w.time?' '+w.time:''} — ${w.type} [${getPhase(w.date)}]\n`;
    if(w.recovery)txt+=`Recovery: ${w.recovery}\n`;

  });

}

const PAGES=['program','log','recovery','calendar','history','progress','report','profile'];
function showPg(p){
  PAGES.forEach(id=>{
    document.getElementById('pg-'+id).classList.toggle('hidden',id!==p);
    const n=document.getElementById('nav-'+id);if(n)n.classList.toggle('on',id===p);
  });
  // Float timer only visible on log page
  const ft=document.getElementById('timer-float');
  if(ft)ft.classList.toggle('visible',p==='log');
  // Render pages
  if(p==='program')renderProgramPage();
  else if(p==='log'){if(!document.getElementById('pg-log').innerHTML.includes('log-date'))renderLogPage();}
  else if(p==='recovery')renderRecoveryPage();
  else if(p==='calendar')renderCalendarPage();
  else if(p==='history')renderHistoryPage();
  else if(p==='progress')renderProgressPage();
  else if(p==='report')renderReportPage();
  else if(p==='profile')renderProfilePage();
}
