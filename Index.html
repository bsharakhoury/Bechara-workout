<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Bechara Workout — Phase 2</title>
<style>
:root{
  --bg:#fff;--bg2:#f7f7f5;--bg3:#efefec;
  --text:#111;--text2:#666;--text3:#aaa;
  --border:#e5e5e2;--border2:#ccc;
  --push:#1e40af;--push-bg:#dbeafe;
  --pull:#166534;--pull-bg:#dcfce7;
  --legs:#92400e;--legs-bg:#fef3c7;
  --upb:#4c1d95;--upb-bg:#ede9fe;
  --mob:#065f46;--mob-bg:#d1fae5;
  --abs:#9f1239;--abs-bg:#ffe4e6;
  --acc:#111;--green:#166534;--green-bg:#dcfce7;
  --red:#991b1b;--red-bg:#fee2e2;--amber:#92400e;--amber-bg:#fef3c7;
  --ss:#4c1d95;--ss-bg:#ede9fe;--blue:#1e40af;--blue-bg:#dbeafe;
  --r:10px;--rs:6px;
}
@media(prefers-color-scheme:dark){
  :root{--bg:#111;--bg2:#1c1c1e;--bg3:#2a2a2c;--text:#f0f0f0;--text2:#999;--text3:#555;--border:#2c2c2e;--border2:#3a3a3c;--acc:#f0f0f0;--green:#86efac;--green-bg:#14532d;--red:#fca5a5;--red-bg:#450a0a;--amber:#fcd34d;--amber-bg:#451a03;--ss-bg:#2e1065;--ss:#c4b5fd;--blue-bg:#1e3a5f;--blue:#93c5fd;}
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:-apple-system,Arial,sans-serif;font-size:14px;line-height:1.5;background:var(--bg);color:var(--text);padding-bottom:76px;}
.hidden{display:none!important;}
.nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--bg2);border-top:.5px solid var(--border);z-index:100;padding-bottom:env(safe-area-inset-bottom,0px);overflow-x:auto;}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;padding:6px 2px 4px;font-size:8px;font-weight:600;color:var(--text2);cursor:pointer;border:none;background:none;gap:2px;white-space:nowrap;min-width:40px;}
.nb.on{color:var(--acc);}
.nb svg{width:18px;height:18px;stroke-width:1.8;}
.pg{padding:14px;max-width:640px;margin:0 auto;}
.ptitle{font-size:20px;font-weight:700;margin-bottom:2px;}
.psub{font-size:12px;color:var(--text2);margin-bottom:14px;}
.card{background:var(--bg2);border-radius:var(--r);padding:12px 14px;margin-bottom:10px;border:.5px solid var(--border);}
.ctitle{font-size:10px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;}
.badge{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;}
.Push{background:var(--push-bg);color:var(--push);}
.Pull{background:var(--pull-bg);color:var(--pull);}
.Legs{background:var(--legs-bg);color:var(--legs);}
.UpperB{background:var(--upb-bg);color:var(--upb);}
.Mobility{background:var(--mob-bg);color:var(--mob);}
.Phase1{background:#f3f4f6;color:#374151;}
.Phase2{background:#dbeafe;color:#1e40af;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:4px;padding:8px 12px;border-radius:var(--rs);font-size:12px;font-weight:600;border:none;cursor:pointer;}
.btn:active{opacity:.7;}
.btn-dark{background:var(--acc);color:var(--bg);}
.btn-ghost{background:transparent;color:var(--text);border:.5px solid var(--border2);}
.btn-red{background:var(--red-bg);color:var(--red);}
.btn-green{background:var(--green-bg);color:var(--green);}
.btn-amber{background:var(--amber-bg);color:var(--amber);}
.btn-blue{background:var(--blue-bg);color:var(--blue);}
.btn-full{width:100%;}
.btn-sm{padding:5px 9px;font-size:11px;}
.btn-xs{padding:3px 7px;font-size:10px;}
input,select,textarea{width:100%;padding:8px 10px;border-radius:var(--rs);border:.5px solid var(--border2);background:var(--bg);color:var(--text);font-size:13px;font-family:inherit;-webkit-appearance:none;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc);}
label{font-size:11px;font-weight:600;color:var(--text2);display:block;margin-bottom:3px;}
.field{margin-bottom:10px;}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;}
.g4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;}
/* PROGRAM */
.ex-plan{background:var(--bg3);border-radius:var(--rs);padding:9px 11px;margin-bottom:7px;border:.5px solid var(--border);}
.ex-plan.ss-hi{border-left:3px solid var(--ss);}
.ex-plan-hd{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:5px;gap:5px;}
.ex-pname{font-weight:700;font-size:12px;}
.ex-pmuscle{font-size:9px;font-weight:600;color:var(--text2);background:var(--bg2);padding:2px 5px;border-radius:8px;flex-shrink:0;}
.plan-hdr{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;margin-bottom:3px;}
.plan-hdr span{font-size:9px;color:var(--text3);font-weight:700;text-transform:uppercase;text-align:center;}
.plan-vals{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;margin-bottom:3px;}
.plan-vals span{font-size:11px;text-align:center;}
.plan-note{font-size:10px;color:var(--text2);font-style:italic;margin-top:3px;}
.ss-strip{background:var(--ss-bg);color:var(--ss);font-size:10px;font-weight:600;padding:3px 7px;border-radius:3px;margin-bottom:5px;}
.tag-new{display:inline-block;font-size:8px;font-weight:700;padding:1px 4px;border-radius:3px;background:var(--green-bg);color:var(--green);margin-left:3px;}
.tag-fix{display:inline-block;font-size:8px;font-weight:700;padding:1px 4px;border-radius:3px;background:var(--amber-bg);color:var(--amber);margin-left:3px;}
.tag-crit{display:inline-block;font-size:8px;font-weight:700;padding:1px 4px;border-radius:3px;background:var(--red-bg);color:var(--red);margin-left:3px;}
.tag-ss{display:inline-block;font-size:8px;font-weight:700;padding:1px 4px;border-radius:3px;background:var(--ss-bg);color:var(--ss);margin-left:3px;}
.wu-strip{background:var(--push-bg);border-radius:var(--rs);padding:7px 10px;margin-bottom:8px;font-size:11px;color:var(--push);}
/* LOG */
.log-ex{background:var(--bg3);border-radius:var(--rs);padding:10px;margin-bottom:8px;border:.5px solid var(--border);}
.log-ex.is-ss{border-left:3px solid var(--ss);}
.log-ex.saved-ex{border-left:3px solid var(--green);}
.log-ex-hd{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:5px;gap:5px;}
.log-exname-inp{font-weight:700;font-size:13px;border:none;background:transparent;width:100%;color:var(--text);padding:0;}
.set-hdr{display:grid;grid-template-columns:20px 1fr 1fr 1fr 1fr 20px 20px;gap:3px;margin-bottom:3px;}
.set-hdr span{font-size:9px;font-weight:700;color:var(--text3);text-align:center;text-transform:uppercase;}
.set-row{display:grid;grid-template-columns:20px 1fr 1fr 1fr 1fr 20px 20px;gap:3px;margin-bottom:4px;align-items:center;}
.set-num{font-size:10px;font-weight:700;color:var(--text3);text-align:center;}
.set-row input{padding:6px 2px;font-size:12px;text-align:center;}
.set-del{background:none;border:none;color:var(--text3);font-size:15px;cursor:pointer;padding:2px;text-align:center;}
.set-dup{background:none;border:none;color:var(--text2);font-size:13px;cursor:pointer;padding:2px;text-align:center;}
.saved-indicator{font-size:10px;color:var(--green);font-weight:600;margin-top:4px;}
/* TIMER */
.timer-bar{background:var(--bg2);border-bottom:.5px solid var(--border);padding:7px 14px;display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:50;}
.timer-disp{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;min-width:70px;color:var(--acc);}
.timer-disp.run{color:#166534;}
.timer-disp.done{color:#991b1b;}
.t-pre{padding:4px 8px;border-radius:14px;font-size:11px;font-weight:600;cursor:pointer;border:.5px solid var(--border2);background:var(--bg);color:var(--text2);}
.t-pre.on{background:var(--acc);color:var(--bg);border-color:var(--acc);}
/* HISTORY */
.hist-card{background:var(--bg2);border-radius:var(--r);padding:11px 13px;margin-bottom:8px;border:.5px solid var(--border);}
.ph1-card{border-left:3px solid #9ca3af;}
.ph2-card{border-left:3px solid #3b82f6;}
/* PROGRESS */
.chart-wrap{position:relative;height:180px;margin:8px 0;}
.muscle-chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px;}
.chip{padding:5px 10px;border-radius:18px;font-size:11px;font-weight:600;cursor:pointer;border:.5px solid var(--border2);background:var(--bg2);color:var(--text2);}
.chip.on{background:var(--acc);color:var(--bg);border-color:var(--acc);}
/* REPORT */
.stat-g{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px;}
.stat{background:var(--bg2);border-radius:var(--rs);padding:10px;text-align:center;border:.5px solid var(--border);}
.stat-v{font-size:20px;font-weight:800;margin-bottom:1px;}
.stat-l{font-size:10px;color:var(--text2);}
.pr-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:.5px solid var(--border);font-size:12px;}
.pr-row:last-child{border-bottom:none;}
.flag{padding:7px 10px;border-radius:var(--rs);font-size:11px;margin-bottom:5px;}
.flag-red{background:var(--red-bg);color:var(--red);}
.flag-green{background:var(--green-bg);color:var(--green);}
.flag-amber{background:var(--amber-bg);color:var(--amber);}
.flag-blue{background:var(--blue-bg);color:var(--blue);}
/* PHASE TIMELINE */
.phase-bar-wrap{background:var(--bg3);border-radius:8px;padding:3px;margin-bottom:8px;}
.phase-bar-fill{height:16px;border-radius:6px;background:linear-gradient(90deg,#166534,#3b82f6);transition:width .5s;display:flex;align-items:center;justify-content:flex-end;padding-right:6px;}
.phase-bar-fill span{font-size:10px;font-weight:700;color:#fff;}
/* BODY VISUAL */
.body-wrap{display:flex;gap:10px;justify-content:center;margin:10px 0;}
.body-svg-wrap{text-align:center;}
.muscle-legend{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;}
.ml-item{display:flex;align-items:center;gap:4px;font-size:10px;}
.ml-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
/* BMI */
.bmi-meter{height:16px;border-radius:8px;background:linear-gradient(90deg,#3b82f6 0%,#22c55e 18.5%,#22c55e 25%,#f59e0b 30%,#ef4444 40%,#7c3aed 100%);position:relative;margin:8px 0;}
.bmi-needle{position:absolute;top:-4px;width:4px;height:24px;background:var(--acc);border-radius:2px;transform:translateX(-50%);transition:left .5s;}
/* PROFILE */
.profile-photo{width:90px;height:90px;border-radius:50%;border:2px solid var(--border2);object-fit:cover;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:32px;flex-shrink:0;overflow:hidden;}
/* RECOVERY TAG */
.rec-tag{display:inline-block;font-size:10px;font-weight:600;padding:2px 6px;border-radius:8px;background:var(--green-bg);color:var(--green);margin:2px;}
/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;display:flex;align-items:flex-end;}
.modal{background:var(--bg);border-radius:var(--r) var(--r) 0 0;padding:18px;width:100%;max-height:90vh;overflow-y:auto;}
.modal-title{font-size:17px;font-weight:700;margin-bottom:12px;}
/* TABS */
.ptabs{display:flex;gap:5px;margin-bottom:14px;overflow-x:auto;padding-bottom:2px;}
.ptab{padding:6px 12px;border-radius:18px;font-size:11px;font-weight:600;cursor:pointer;border:.5px solid var(--border2);background:var(--bg2);color:var(--text2);white-space:nowrap;flex-shrink:0;}
.ptab.on{background:var(--acc);color:var(--bg);border-color:var(--acc);}
.info-box{background:var(--push-bg);border-left:3px solid var(--push);padding:8px 11px;border-radius:0 var(--rs) var(--rs) 0;font-size:11px;color:var(--push);margin-bottom:8px;}
.warn-box{background:var(--red-bg);border-left:3px solid var(--red);padding:8px 11px;border-radius:0 var(--rs) var(--rs) 0;font-size:11px;color:var(--red);margin-bottom:8px;}
.ok-box{background:var(--green-bg);border-left:3px solid var(--green);padding:8px 11px;border-radius:0 var(--rs) var(--rs) 0;font-size:11px;color:var(--green);margin-bottom:8px;}
.edit-ind{background:var(--amber-bg);color:var(--amber);font-size:10px;font-weight:700;padding:3px 8px;border-radius:var(--rs);display:inline-block;margin-bottom:8px;}
.divider{border:none;border-top:.5px solid var(--border);margin:12px 0;}
.prog-chart-mini{position:relative;height:120px;margin:6px 0;}
</style>
</head>
<body>

<!-- PAGES -->
<div id="pg-program" class="pg hidden"></div>
<div id="pg-log" class="pg hidden"></div>
<div id="pg-recovery" class="pg hidden"></div>
<div id="pg-history" class="pg hidden"></div>
<div id="pg-progress" class="pg hidden"></div>
<div id="pg-report" class="pg hidden"></div>
<div id="pg-profile" class="pg hidden"></div>

<!-- NAV -->
<nav class="nav">
  <button class="nb on" onclick="showPg('program')" id="nav-program"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg><span>Program</span></button>
  <button class="nb" onclick="showPg('log')" id="nav-log"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 5v14M5 12h14"/></svg><span>Log</span></button>
  <button class="nb" onclick="showPg('recovery')" id="nav-recovery"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/></svg><span>Recovery</span></button>
  <button class="nb" onclick="showPg('history')" id="nav-history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 12h18M3 6h18M3 18h18"/></svg><span>History</span></button>
  <button class="nb" onclick="showPg('progress')" id="nav-progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg><span>Progress</span></button>
  <button class="nb" onclick="showPg('report')" id="nav-report"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8 12h8M8 8h8M8 16h5"/></svg><span>Report</span></button>
  <button class="nb" onclick="showPg('profile')" id="nav-profile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg><span>Profile</span></button>
</nav>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
// ─── STORAGE ────────────────────────────────────────────────────────────────
const WK='bechara_v5_wk',RK='bechara_v5_rec',PK='bechara_v5_prof',DRAFT='bechara_v5_draft';
function wLoad(){try{return JSON.parse(localStorage.getItem(WK)||'[]');}catch(e){return[];}}
function wSave(d){localStorage.setItem(WK,JSON.stringify(d));}
function rLoad(){try{return JSON.parse(localStorage.getItem(RK)||'{}');}catch(e){return{};}}
function rSave(d){localStorage.setItem(RK,JSON.stringify(d));}
function pLoad(){try{return JSON.parse(localStorage.getItem(PK)||'{}');}catch(e){return{};}}
function pSave(d){localStorage.setItem(PK,JSON.stringify(d));}
function draftSave(d){localStorage.setItem(DRAFT,JSON.stringify(d));}
function draftLoad(){try{return JSON.parse(localStorage.getItem(DRAFT)||'null');}catch(e){return null;}}
function draftClear(){localStorage.removeItem(DRAFT);}

// ─── PHASE CONFIG ─────────────────────────────────────────────────────────────
const PHASE1_END = '2026-04-05'; // everything before Apr 6 = Phase 1
const PHASE2_START = '2026-04-06';
const PHASE2_WEEKS = 12;
const PHASE2_END_DATE = new Date('2026-04-06');
PHASE2_END_DATE.setDate(PHASE2_END_DATE.getDate() + PHASE2_WEEKS * 7);
const PHASE2_END = PHASE2_END_DATE.toISOString().split('T')[0]; // ~June 29

function getPhase(date){return date <= PHASE1_END ? 'Phase1' : 'Phase2';}

// ─── PHASE 2 PROGRAM (corrected order + superset fixes) ─────────────────────
// SUPERSET RULES FIXED:
// - Arnold Press (2 sets) SS with Suitcase Carry — both 2 sets, grouped at end of Day A
// - Day A: Chest compounds first, then shoulder, then SS groups, then abs
// - All SS pairs have matching set counts
const PHASE2 = {
  A:{label:'Day A — Push',type:'Push',
    warmup:'Band pull-aparts 3×20 · Wall slides 2×10 · Thoracic rotation 8 each side · 8 min',
    exercises:[
      // 1. Main compound — solo, heavy, first
      {name:'Barbell Chest Press',muscle:'Chest',sets:4,reps:'9/8/7/5',weight:'47.5/55/60/65',tempo:'3-1-1',rest:'3 min',note:'Main compound. Solo. Push top set toward 65.',tags:[],ssGroup:null},
      // 2. Upper chest — solo
      {name:'Incline DB Press',muscle:'Chest',sets:3,reps:'10',weight:'20–22.5 ea.',tempo:'3-0-1',rest:'2 min',note:'30° incline. Upper chest. Full stretch at bottom.',tags:[],ssGroup:null},
      // 3. Shoulder press — solo, plateau fix
      {name:'Standing DB Shoulder Press',muscle:'Shoulders',sets:3,reps:'10',weight:'12.5 ea.',tempo:'3-0-1',rest:'2 min',note:'Plateau fix. Solo. 3 sec down. Full ROM.',tags:['fix'],ssGroup:null},
      // 4. SS pair A: Lateral Raise + Skull Crusher (3 sets each — matched)
      {name:'DB Lateral Raise — seated',muscle:'Shoulders',sets:3,reps:'15',weight:'5 ea.',tempo:'2-2-1',rest:'0→SS',note:'SS with Skull Crusher. 30° lean. 2 sec hold top. Apr 6: 18 reps at 5kg.',tags:['fix','ss'],ssGroup:'A4',ssPartner:'EZ Bar Skull Crusher'},
      {name:'EZ Bar Skull Crusher',muscle:'Triceps',sets:3,reps:'12',weight:'22.5–27.5',tempo:'3-0-1',rest:'90s',note:'SS with Lateral Raise. Elbows vertical. Lower to forehead.',tags:['ss'],ssGroup:'A4',ssPartner:'DB Lateral Raise — seated'},
      // 5. SS pair B: Chest Fly + Pallof Press (3 sets each — matched)
      {name:'Cable Chest Fly',muscle:'Chest',sets:3,reps:'12',weight:'19–24 ea.',tempo:'2-1-1',rest:'0→SS',note:'SS with Pallof. Full pec stretch at bottom.',tags:['ss'],ssGroup:'A5',ssPartner:'Pallof Press'},
      {name:'Pallof Press',muscle:'Core',sets:3,reps:'12 ea.',weight:'Light',tempo:'hold 2s',rest:'90s',note:'SS with Chest Fly. Arms extended. Anti-rotation.',tags:['new','ss'],ssGroup:'A5',ssPartner:'Cable Chest Fly'},
      // 6. SS pair C: Arnold Press + Suitcase Carry (2 sets each — NOW MATCHED)
      {name:'Arnold Press',muscle:'Shoulders',sets:2,reps:'10',weight:'10–12 ea.',tempo:'2-1-2',rest:'0→SS',note:'SS with Suitcase Carry. 2 sets only. Rotate palms facing you → up.',tags:['new','ss'],ssGroup:'A6',ssPartner:'Suitcase Carry'},
      {name:'Suitcase Carry',muscle:'Core',sets:2,reps:'20m ea.',weight:'22.5–25',tempo:'—',rest:'90s',note:'SS with Arnold Press. 2 sets only. One hand. Tall spine. Resist lean.',tags:['new','ss'],ssGroup:'A6',ssPartner:'Arnold Press'},
      // 7. Abs — end of session
      {name:'Abs — 6P Circuit',muscle:'Abs',sets:1,reps:'8 min',weight:'BW',tempo:'—',rest:'—',note:'Crunches · Reverse crunches · Russian twist · Plank · Bicycle · Mountain climber · Leg raise',tags:['abs'],ssGroup:null},
    ]},
  B:{label:'Day B — Pull',type:'Pull',
    warmup:'C-SPINE PROTOCOL — 10 min. Band face pulls 3×20 · Chin tucks 3×10 (5 sec hold) · Band pull-aparts 2×15',
    exercises:[
      // 1. Pull-ups — max effort, solo
      {name:'Wide Pull-Ups',muscle:'Back',sets:3,reps:'Max',weight:'BW',tempo:'2-0-2',rest:'3 min',note:'Track total reps. Currently 6/6/6 → target 10/8/6.',tags:[],ssGroup:null},
      // 2. Lat pulldown — heavy vertical pull
      {name:'Lat Pulldown',muscle:'Back',sets:4,reps:'9/8/7/6',weight:'63/67.5/72/76.5',tempo:'2-1-2',rest:'2.5 min',note:'Solo. Progress past 72. Bar to upper chest.',tags:[],ssGroup:null},
      // 3. Horizontal pull — heavy
      {name:'Cable Seated Row',muscle:'Back',sets:3,reps:'9',weight:'94/99/104',tempo:'2-1-2',rest:'2.5 min',note:'Solo. 1 sec pause at full retraction.',tags:[],ssGroup:null},
      // 4. RDL — hamstring priority
      {name:'Romanian Deadlift (RDL)',muscle:'Hamstrings',sets:4,reps:'10',weight:'50/55/60/60',tempo:'4-1-1',rest:'2.5 min',note:'NEW. 4 sec eccentric. Feel hamstring load. Neutral spine always.',tags:['new'],ssGroup:null},

// ─── TIMER ──────────────────────────────────────────────────────────────────
let timerSec=0,timerTgt=0,timerRun=false,timerInt=null;
function fmtT(s){const neg=s<0;const abs=Math.abs(s);return(neg?'-':'')+Math.floor(abs/60)+':'+(abs%60<10?'0':'')+abs%60;}
function updTimers(){
  const d=fmtT(timerSec);
  const cls='timer-disp'+(timerRun?' run':timerSec<0?' done':'');
  ['td1','td2'].forEach(id=>{const e=document.getElementById(id);if(e){e.textContent=d;e.className=cls;}});
}
function setTimer(s,el){
  timerSec=s;timerTgt=s;timerRun=false;
  if(timerInt){clearInterval(timerInt);timerInt=null;}
  updTimers();
  document.querySelectorAll('.t-pre').forEach(p=>p.classList.remove('on'));
  if(el)el.classList.add('on');
  ['tb1','tb2'].forEach(id=>{const e=document.getElementById(id);if(e)e.textContent='Start';});
}
function startStopTimer(){
  if(timerRun){
    clearInterval(timerInt);timerInt=null;timerRun=false;
    ['tb1','tb2'].forEach(id=>{const e=document.getElementById(id);if(e)e.textContent='Resume';});
  } else {
    timerRun=true;
    ['tb1','tb2'].forEach(id=>{const e=document.getElementById(id);if(e)e.textContent='Pause';});
    timerInt=setInterval(()=>{
      timerSec--;updTimers();
      if(timerSec===0&&navigator.vibrate)navigator.vibrate([300,100,300]);
    },1000);
  }
}
function resetTimer(){
  clearInterval(timerInt);timerInt=null;timerRun=false;
  timerSec=timerTgt;updTimers();
  ['tb1','tb2'].forEach(id=>{const e=document.getElementById(id);if(e)e.textContent='Start';});
}
function timerHTML(id1,id2,id3){
  return`<div class="timer-bar">
    <div class="timer-disp" id="${id1}">0:00</div>
    <div style="flex:1;">
      <div style="display:flex;gap:4px;margin-bottom:4px;flex-wrap:wrap;">
        <div class="t-pre" onclick="setTimer(60,this)">1m</div>
        <div class="t-pre" onclick="setTimer(90,this)">90s</div>
        <div class="t-pre" onclick="setTimer(120,this)">2m</div>
        <div class="t-pre" onclick="setTimer(150,this)">2:30</div>
        <div class="t-pre" onclick="setTimer(180,this)">3m</div>
      </div>
      <div style="display:flex;gap:6px;">
        <button class="btn btn-dark btn-sm" onclick="startStopTimer()" id="${id2}" style="flex:1;">Start</button>
        <button class="btn btn-ghost btn-sm" onclick="resetTimer()">Reset</button>
      </div>
    </div>
  </div>`;
}

function addExercise(){
  const name=document.getElementById('new-ex-name').value.trim();
  const muscle=document.getElementById('new-ex-muscle').value;
  if(!name){alert('Enter name');return;}
  currentExercises.push({name,muscle,ssLabel:null,planned:null,sets:[{r:'',kg:'',t:'',n:''}],saved:false});
  document.getElementById('new-ex-name').value='';
  renderLogExercises();
  autoDraft();
}
function addSet(idx){
  const last=currentExercises[idx].sets.slice(-1)[0];
  currentExercises[idx].sets.push({r:'',kg:'',t:last?.t||'',n:''});
  currentExercises[idx].saved=false;
  renderLogExercises();autoDraft();
}
function dupSet(idx,si){
  const s={...currentExercises[idx].sets[si]};
  currentExercises[idx].sets.splice(si+1,0,s);
  currentExercises[idx].saved=false;
  renderLogExercises();autoDraft();
}
function removeSet(idx,si){
  if(currentExercises[idx].sets.length<=1)return;
  currentExercises[idx].sets.splice(si,1);
  renderLogExercises();autoDraft();
}
function removeExercise(idx){currentExercises.splice(idx,1);renderLogExercises();autoDraft();}
function editExName(idx,v){currentExercises[idx].name=v;autoDraft();}
function editSet(idx,si,f,v){currentExercises[idx].sets[si][f]=v;currentExercises[idx].saved=false;autoDraft();}
function saveExercise(idx){
  currentExercises[idx].saved=true;
  autoDraft();
  renderLogExercises();
  // flash saved
  const el=document.getElementById('ex-saved-'+idx);
  if(el){el.textContent='✓ Saved';el.style.color='var(--green)';}
}
function autoDraft(){
  const d=document.getElementById('log-date');
  const t=document.getElementById('log-type');
  draftSave({
    exercises:currentExercises,
    type:t?t.value:'',
    date:d?d.value:'',
    editingId
  });
}

function renderLogExercises(){
  const c=document.getElementById('log-exercises');if(!c)return;
  c.innerHTML=currentExercises.map((ex,idx)=>{
    const p=ex.planned;
    const isSS=!!ex.ssLabel;
    const isSaved=ex.saved;
    return`<div class="log-ex${isSS?' is-ss':''}${isSaved?' saved-ex':''}" id="lex-${idx}">
      ${ex.ssLabel?`<div class="ss-strip" style="margin-bottom:6px;">⟳ SS with: ${ex.ssLabel}</div>`:''}
      <div class="log-ex-hd">
        <div style="flex:1;margin-right:5px;">
          <input class="log-exname-inp" value="${ex.name}" onchange="editExName(${idx},this.value)">
          <div style="font-size:10px;color:var(--text2);">${ex.muscle}</div>
        </div>
        <div style="display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;">
          <button class="btn btn-green btn-xs" onclick="saveExercise(${idx})">💾 Save</button>
          <button class="btn btn-ghost btn-xs" onclick="addSet(${idx})">+Set</button>
          <button class="btn btn-red btn-xs" onclick="removeExercise(${idx})">✕</button>
        </div>
      </div>
      ${isSaved?'<div class="saved-indicator">✓ Exercise saved</div>':''}
      ${p?`<div style="background:var(--push-bg);border-radius:var(--rs);padding:5px 8px;margin-bottom:6px;font-size:10px;color:var(--push);">
        Plan: ${p.sets}×${p.reps} · ${p.weight} · ${p.tempo} · Rest ${p.rest}
      </div>`:''}
      <div class="set-hdr"><span>#</span><span>Reps</span><span>kg</span><span>Tempo</span><span>Note</span><span>⧉</span><span>−</span></div>
      ${ex.sets.map((s,si)=>`<div class="set-row">
        <div class="set-num">${si+1}</div>
        <input type="number" value="${s.r}" placeholder="${p?(p.reps.split('/')[si]||p.reps.split('/')[0]):'—'}" onchange="editSet(${idx},${si},'r',+this.value)">
        <input type="number" step="0.5" value="${s.kg}" placeholder="kg" onchange="editSet(${idx},${si},'kg',+this.value)">
        <input type="text" value="${s.t}" placeholder="${p?p.tempo:'—'}" onchange="editSet(${idx},${si},'t',this.value)">
        <input type="text" value="${s.n}" placeholder="note" onchange="editSet(${idx},${si},'n',this.value)">
        <button class="set-dup" onclick="dupSet(${idx},${si})">⧉</button>
        <button class="set-del" onclick="removeSet(${idx},${si})">−</button>
      </div>`).join('')}
    </div>`;
  }).join('');
}

function saveWorkout(){
  const date=document.getElementById('log-date')?.value;
  const time=document.getElementById('log-time')?.value;
  const type=document.getElementById('log-type')?.value;
  const notes=document.getElementById('log-notes')?.value||'';
  const recovery=document.getElementById('log-recovery')?.value||'';
  if(!date){alert('Select a date');return;}
  if(!currentExercises.length){alert('Add at least one exercise');return;}
  const data=wLoad();
  const w={
    id:editingId||('w'+Date.now()),
    date,time,type,notes,recovery,phase:getPhase(date),
    exercises:currentExercises.map(ex=>({
      name:ex.name,muscle:ex.muscle,ssLabel:ex.ssLabel||null,
      sets:ex.sets.filter(s=>s.r||s.kg)
    }))
  };
  if(editingId){const i=data.findIndex(x=>x.id===editingId);if(i>=0)data[i]=w;else data.push(w);}
  else data.push(w);
  data.sort((a,b)=>a.date.localeCompare(b.date));
  wSave(data);draftClear();
  editingId=null;currentExercises=[];
  alert('Workout saved!');
  showPg('history');
}
function cancelEdit(){editingId=null;currentExercises=[];draftClear();showPg('history');}

// ─── PROGRESS PAGE ────────────────────────────────────────────────────────────
let progChartInst=null;
function buildExMap(){
  const map={};
  wLoad().forEach(w=>w.exercises.forEach(ex=>{
    if(!map[ex.name])map[ex.name]={muscle:ex.muscle,entries:[]};
    const top=Math.max(...ex.sets.map(s=>+s.kg||0));
    if(top>0)map[ex.name].entries.push({date:w.date,kg:top,phase:w.phase||getPhase(w.date)});
  }));
  return map;
}
function renderProgressPage(){
  const map=buildExMap();
  const muscles=[...new Set(Object.values(map).map(v=>v.muscle))].sort();
  document.getElementById('pg-progress').innerHTML=`
    <div class="ptitle">Progress</div>
    <div class="psub">Track any lift over time</div>
    <div class="card">
      <label style="margin-bottom:5px;">Choose exercise</label>
      <select id="prog-sel" onchange="renderProgChart()">
        <option value="">— select —</option>
        ${Object.keys(map).sort().map(n=>`<option value="${n}">${n}</option>`).join('')}
      </select>
    </div>
    <div class="card" id="prog-chart-card" style="display:none;">
      <div class="ctitle" id="prog-chart-title"></div>
      <div class="chart-wrap"><canvas id="progChart"></canvas></div>
      <div id="prog-stats" style="margin-top:8px;"></div>
    </div>
    <div class="card">
      <div class="ctitle">Browse by muscle</div>
      <div class="muscle-chips">${muscles.map(m=>`<div class="chip" onclick="filterMuscle('${m}',this)">${m}</div>`).join('')}</div>
      <div id="muscle-ex-list"></div>
    </div>`;
}
function renderProgChart(){
  const name=document.getElementById('prog-sel')?.value;
  if(!name){document.getElementById('prog-chart-card').style.display='none';return;}
  const map=buildExMap();const ex=map[name];
  if(!ex||!ex.entries.length){document.getElementById('prog-chart-card').style.display='none';return;}
  document.getElementById('prog-chart-card').style.display='block';
  document.getElementById('prog-chart-title').textContent=name+' — top set kg';
  const vals=ex.entries.map(e=>Math.round(e.kg*10)/10); // FIX: round to 1dp
  const labels=ex.entries.map(e=>fmtDate(e.date,true));
  const mn=Math.max(0,Math.min(...vals)-5),mx=Math.max(...vals)+5;
  if(progChartInst)progChartInst.destroy();
  progChartInst=new Chart(document.getElementById('progChart').getContext('2d'),{
    type:'line',
    data:{labels,datasets:[{label:'kg',data:vals,borderColor:'#111',backgroundColor:'rgba(17,17,17,.08)',tension:.3,fill:true,pointRadius:3,pointBackgroundColor:'#111'}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{
      x:{ticks:{font:{size:9},maxRotation:45},grid:{color:'rgba(0,0,0,.04)'}},
      y:{min:mn,max:mx,ticks:{font:{size:10},callback:v=>Math.round(v*10)/10},grid:{color:'rgba(0,0,0,.04)'}}
    }}
  });
  const first=vals[0],last=vals[vals.length-1];
  const gain=Math.round((last-first)*10)/10;
  const pct=first?Math.round((gain/first)*100):0;
  document.getElementById('prog-stats').innerHTML=`<div class="g4">
    <div class="stat"><div class="stat-v">${first}</div><div class="stat-l">Start</div></div>
    <div class="stat"><div class="stat-v">${last}</div><div class="stat-l">Now</div></div>
    <div class="stat"><div class="stat-v" style="color:${gain>=0?'var(--green)':'var(--red)'};">${gain>=0?'+':''}${gain}</div><div class="stat-l">Gained</div></div>
    <div class="stat"><div class="stat-v">${pct}%</div><div class="stat-l">Change</div></div>
  </div>`;
}
function filterMuscle(m,btn){
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));btn.classList.add('on');
  const map=buildExMap();
  const exs=Object.entries(map).filter(([,v])=>v.muscle===m);
  document.getElementById('muscle-ex-list').innerHTML=exs.length?exs.map(([n,v])=>{

function renderVolChart(data){
  const tc={};
  data.forEach(w=>{
    const t=w.type||'Other';
    const vol=w.exercises.reduce((a,e)=>a+e.sets.reduce((b,s)=>b+(+s.r||0)*(+s.kg||0),0),0);
    tc[t]=(tc[t]||0)+vol;
  });

    type:'doughnut',
    data:{

      datasets:[{data:Object.values(tc).map(v=>Math.round(v/1000*10)/10),backgroundColor:Object.keys(tc).map(k=>cols[k]||'#888'),borderWidth:0}]
    },

function renderPhase2Analysis(map,ph2Sessions,wkDone){
  const el=document.getElementById('phase2-analysis');if(!el)return;
  if(!ph2Sessions.length){el.innerHTML='<div style="color:var(--text2);font-size:12px;">No Phase 2 sessions logged yet. Start logging from Apr 6.</div>';return;}
  const analysis=[];
  PROGRESSION.forEach(p=>{
    const ex=map[p.ex];
    if(!ex||!ex.entries.length)return;
    const ph2entries=ex.entries.filter(e=>e.phase==='Phase2'||e.date>=PHASE2_START);
    const currentKg=ph2entries.length?Math.round(Math.max(...ph2entries.map(e=>e.kg))*10)/10:Math.round(Math.max(...ex.entries.map(e=>e.kg))*10)/10;
    const targetKg=p.targets[Math.min(wkDone,11)];
    const weekTarget=p.targets[Math.min(wkDone,11)];
    const on=currentKg>=weekTarget*0.95;
    const pctToTarget=targetKg?Math.round((currentKg/p.targets[11])*100):0;
    analysis.push({name:p.ex,current:currentKg,weekTarget,endTarget:p.targets[11],on,pctToTarget,unit:p.unit});
  });
  el.innerHTML=analysis.map(a=>`<div style="margin-bottom:10px;">
    <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px;">
      <span style="font-weight:600;">${a.name}</span>
      <span style="color:${a.on?'var(--green)':'var(--amber)'};">${a.on?'✓ On track':'⚠ Needs push'}</span>
    </div>
    <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--text2);margin-bottom:3px;">
      <span>Now: ${a.current} ${a.unit}</span>
      <span>Wk${Math.min(wkDone+1,12)} target: ${a.weekTarget}</span>
      <span>Phase end: ${a.endTarget}</span>
    </div>
    <div style="background:var(--bg3);border-radius:6px;padding:2px;">
      <div style="height:8px;border-radius:5px;background:${a.on?'#166534':'#f59e0b'};width:${Math.min(100,a.pctToTarget)}%;"></div>
    </div>
    <div style="font-size:9px;color:var(--text3);margin-top:2px;">${a.pctToTarget}% toward phase end target</div>
  </div>`).join('');
}

function renderFixGood(map,ph2){
  const fixes=[];const goods=[];
  const ht=map['Barbell Hip Thrust'];
  if(ht){const b=Math.round(Math.max(...ht.entries.map(e=>e.kg))*10)/10;if(b<=40)fixes.push({t:`Hip thrust capped at 40kg — progress via reps (target 20 reps with 3s pause).`,c:'amber'});}
  const lr=map['DB Lateral Raise — seated']||map['DB Lateral Raise'];
  if(lr){const b=Math.round(Math.max(...lr.entries.map(e=>e.kg))*10)/10;if(b<=5)fixes.push({t:`Lateral raise at ${b}kg with up to 18 reps (Apr 6). Pattern is building. Next milestone: 6kg with 15 clean reps.`,c:'amber'});}
  const sp=map['Standing DB Shoulder Press']||map['Seated Shoulder Press'];
  if(sp){const b=Math.round(Math.max(...sp.entries.map(e=>e.kg))*10)/10;if(b<=12.5)fixes.push({t:`Shoulder press at ${b}kg. Double frequency (Days A+D) should move this within 3 weeks. First target: 13.75 ea.`,c:'amber'});}
  if(!map['Romanian Deadlift (RDL)'])fixes.push({t:'RDL not yet logged. Add to every Pull day — most important new addition for hamstring health.',c:'red'});
  if(!map['Cable Face Pull']&&!map['Face Pull'])fixes.push({t:'Face pulls missing. C-spine protection. Every Pull warmup without fail.',c:'red'});
  if(ph2.length===0)fixes.push({t:'Phase 2 just started. First session logged: Apr 6 (Upper B). Keep the 5-day structure consistent.',c:'blue'});

  const dl=map['Barbell Deadlift'];if(dl&&dl.entries.length>2){const g=Math.round((Math.max(...dl.entries.map(e=>e.kg))-dl.entries[0].kg)*10)/10;if(g>0)goods.push(`Deadlift up ${g}kg to ${Math.round(Math.max(...dl.entries.map(e=>e.kg))*10)/10}kg.`);}
  const sq=map['Smith Machine Front Squat'];if(sq&&sq.entries.length>2){const g=Math.round((Math.max(...sq.entries.map(e=>e.kg))-sq.entries[0].kg)*10)/10;if(g>0)goods.push(`Front squat up ${g}kg.`);}
  const row=map['Cable Seated Row'];if(row&&row.entries.length>2){const g=Math.round((Math.max(...row.entries.map(e=>e.kg))-row.entries[0].kg)*10)/10;if(g>0)goods.push(`Seated row up ${g}kg.`);}
  const cp=map['Barbell Chest Press']||map['Incline DB Press'];if(cp&&cp.entries.length>2){const g=Math.round((Math.max(...cp.entries.map(e=>e.kg))-cp.entries[0].kg)*10)/10;if(g>0)goods.push(`Chest press up ${g}kg.`);}
  if(lr&&Math.max(...lr.entries.map(e=>e.kg))>=5)goods.push('Lateral raise at 5kg — 18 reps on Apr 6. Technique reset is working.');
  goods.push(`${wLoad().length} total sessions logged across Phase 1 and Phase 2.`);

  const fl=document.getElementById('fix-list');if(fl)fl.innerHTML=fixes.length?fixes.map(f=>`<div class="flag flag-${f.c}">${f.t}</div>`).join(''):'<div class="flag flag-green">No critical issues.</div>';
  const gl=document.getElementById('good-list');if(gl)gl.innerHTML=goods.map(g=>`<div class="flag flag-green">${g}</div>`).join('');
}

function calcAge(dob){
  if(!dob)return'38';
  const d=new Date(dob);const now=new Date();
  let age=now.getFullYear()-d.getFullYear();
  if(now.getMonth()<d.getMonth()||(now.getMonth()===d.getMonth()&&now.getDate()<d.getDate()))age--;
  return age;
}
function calcBMI(h,w){
  if(!h||!w)return'—';
  return Math.round((w/((h/100)**2))*10)/10;
}
function bmiCategory(bmi){
  if(bmi<18.5)return{label:'Underweight',c:'var(--blue)'};
  if(bmi<25)return{label:'Normal',c:'var(--green)'};
  if(bmi<30)return{label:'Overweight',c:'var(--amber)'};
  return{label:'Obese',c:'var(--red)'};
}
function renderBMISection(prof){
  const h=prof.height||173,w=prof.weight||74;
  const bmi=calcBMI(h,w);
  const cat=bmiCategory(+bmi);
  const pct=Math.min(100,Math.max(0,((+bmi-15)/25)*100));
  const el=document.getElementById('bmi-section');if(!el)return;
  el.innerHTML=`<div style="margin-top:10px;">
    <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text2);margin-bottom:3px;">
      <span>BMI: <strong style="color:${cat.c};">${bmi} — ${cat.label}</strong></span>
      <span>H: ${h}cm · W: ${w}kg</span>
    </div>
    <div class="bmi-meter"><div class="bmi-needle" style="left:${pct}%;"></div></div>
    <div style="display:flex;justify-content:space-between;font-size:9px;color:var(--text3);margin-top:2px;">
      <span>15</span><span>18.5</span><span>25</span><span>30</span><span>40</span>
    </div>
  </div>`;
}
function logBMI(){
  const date=document.getElementById('bmi-date')?.value;
  const weight=+(document.getElementById('bmi-weight')?.value);
  if(!date||!weight){alert('Enter date and weight');return;}
  const prof=pLoad();

function calcMuscleScores(map){
  const muscles={Chest:0,Shoulders:0,Back:0,Biceps:0,Triceps:0,Legs:0,Glutes:0,Hamstrings:0,Calves:0,Core:0};
  Object.entries(map).forEach(([name,v])=>{
    const m=v.muscle;if(!(m in muscles))return;
    const sessions=v.entries.length;
    const progress=v.entries.length>1?(Math.max(...v.entries.map(e=>e.kg))-v.entries[0].kg)/v.entries[0].kg*100:0;
    const score=Math.min(100,Math.round(sessions*5+Math.max(0,progress)*0.5));
    muscles[m]=Math.max(muscles[m]||0,score);
  });
  return muscles;
}
function muscleColor(score){
  if(score>=70)return'#166534';
  if(score>=40)return'#3b82f6';
  if(score>=20)return'#f59e0b';
  return'#e5e7eb';
}

  txt+=`════════════\nSUMMARY\n════════════\n`;
  txt+=`Total sessions: ${data.length} (Phase 1: ${data.filter(w=>getPhase(w.date)==='Phase1').length} · Phase 2: ${data.filter(w=>getPhase(w.date)==='Phase2').length})\n`;
  txt+=`Total sets: ${data.reduce((a,w)=>a+w.exercises.reduce((b,e)=>b+e.sets.length,0),0)}\n`;
  txt+=`Total volume: ${(data.reduce((a,w)=>a+w.exercises.reduce((b,e)=>b+e.sets.reduce((c,s)=>c+(+s.r||0)*(+s.kg||0),0),0),0)/1000).toFixed(2)} tonnes\n\n`;
  txt+=`════════════\nPERSONAL RECORDS\n════════════\n`;
  prs.forEach(p=>{txt+=`${p.n.padEnd(35)} ${p.pr} kg  [${p.m}]\n`;});
  txt+=`\n════════════\nBMI LOG\n════════════\n`;
  (prof.bmiLog||[]).forEach(e=>{txt+=`${fmtDate(e.date,true)}  ${e.weight}kg  BMI ${e.bmi}\n`;});
  txt+=`\n════════════\nSESSION LOG\n════════════\n`;
  data.slice().reverse().forEach(w=>{
    txt+=`\n${fmtDate(w.date)}${w.time?' '+w.time:''} — ${w.type} [${w.phase||getPhase(w.date)}]\n`;
    if(w.recovery)txt+=`Recovery: ${w.recovery}\n`;
    w.exercises.forEach(ex=>{
      txt+=`  ${ex.name} (${ex.muscle})\n`;
      ex.sets.forEach((s,i)=>{txt+=`    Set ${i+1}: ${s.r||'—'} reps @ ${s.kg||'—'}kg${s.t?' | '+s.t:''}${s.n?' | '+s.n:''}\n`;});
    });
    if(w.notes)txt+=`  Notes: "${w.notes}"\n`;
  });
  txt+=`\n════════════\nRECOVERY LOG\n════════════\n`;
  Object.keys(allRec).sort().reverse().forEach(d=>{
    const day=allRec[d];const done=REC_ITEMS.filter(ri=>day[ri.id]?.done);
    if(!done.length&&!day.dayNotes)return;
    txt+=`\n${fmtDate(d)}\n`;
    done.forEach(ri=>{txt+=`  ✓ ${ri.label}${allRec[d][ri.id]?.note?' — '+allRec[d][ri.id].note:''}\n`;});

  });
  txt+=`\n════════════\nPHASE 2 PROGRAM\n════════════\n`;
  Object.entries(PHASE2).forEach(([key,day])=>{
    txt+=`\n${day.label.toUpperCase()}\nWarmup: ${day.warmup}\n\n`;
    day.exercises.forEach((ex,i)=>{
      txt+=`${i+1}. ${ex.name} [${ex.muscle}]${ex.ssGroup?' [SS: '+ex.ssPartner+']':''}\n`;
      txt+=`   ${ex.sets}×${ex.reps} | ${ex.weight} | ${ex.tempo} | Rest ${ex.rest}\n   ${ex.note}\n`;
    });
  });
  const blob=new Blob([txt],{type:'text/plain'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`bechara_v5_report_${new Date().toISOString().split('T')[0]}.txt`;
  a.click();URL.revokeObjectURL(a.href);
}

function importData(){
  const inp=document.createElement('input');inp.type='file';inp.accept='.json,.txt';
  inp.onchange=e=>{
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const data=JSON.parse(ev.target.result);
        if(Array.isArray(data)){wSave(data);alert('Workout data imported — '+data.length+' sessions.');renderHistoryPage();}
        else if(data.workouts){wSave(data.workouts);if(data.recovery)rSave(data.recovery);alert('Data imported successfully.');renderHistoryPage();}
        else{alert('Unrecognised format.');}
      }catch(err){alert('Could not read file: '+err.message);}
    };reader.readAsText(file);
  };inp.click();
}

}

document.addEventListener('DOMContentLoaded',()=>{
  seed();
  // Check for draft
  const draft=draftLoad();
  if(draft&&draft.exercises&&draft.exercises.length>0){
    if(confirm('You have an unsaved workout draft. Continue it?')){
      currentExercises=draft.exercises;
      editingId=draft.editingId||null;
      renderLogPage();
      showPg('log');
      if(draft.date){const d=document.getElementById('log-date');if(d)d.value=draft.date;}
      if(draft.type){const t=document.getElementById('log-type');if(t)t.value=draft.type;}
    } else {draftClear();}
  }
  showPg('program');
});
